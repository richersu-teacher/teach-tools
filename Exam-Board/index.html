<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧教室考試資訊看板 (多主題旗艦版)</title>
    <!-- Tailwind CSS (固定版本 3.4.1) -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <!-- React & ReactDOM (固定版本 18.2.0，並切換為 production 正式版) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel (固定版本 7.24.0) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <!-- Google Fonts: Share Tech Mono for general tech text, Chakra Petch for Digits -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎設定 */
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", "Arial", sans-serif;
            overflow: hidden;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 一般模式的平滑動畫 */
        .track-transition { transition: stroke-dashoffset 1s linear, stroke 0.5s ease; }
        
        /* [科技模式] 移除 dashoffset 動畫達成瞬間切換(Snap)，保留顏色過渡 */
        .tech-snap { 
            transition: stroke 0.5s ease; 
        }

        /* [新增] 暗閃爍動畫 (Dark Flicker) - 2.7秒 */
        @keyframes dark-flicker {
            0% { opacity: 1; filter: brightness(1); }
            15% { opacity: 0.2; filter: brightness(0.5); }
            30% { opacity: 1; filter: brightness(1.2); }
            45% { opacity: 0.2; filter: brightness(0.5); }
            60% { opacity: 1; filter: brightness(1.1); }
            75% { opacity: 0.2; filter: brightness(0.5); }
            90% { opacity: 0.5; filter: brightness(0.8); } 
            60% { opacity: 1; filter: brightness(1.1); } 
        }
        
        .effect-flicker {
            animation: dark-flicker 2.7s linear forwards;
        }

        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: modalFadeIn 0.2s ease-out forwards; }

        .magic-filter { filter: grayscale(100%) contrast(150%) brightness(110%); }
        .img-contain { object-fit: contain; width: 100%; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .btn-press:active { transform: scale(0.95); }

        /* --- SVG Segment Styles --- */
        .segment { transition: fill 0.1s, opacity 0.1s, filter 0.1s; }
        /* 有光暈版本 (用於大時鐘) */
        .seg-lit-glow { opacity: 1; filter: drop-shadow(0 0 5px currentColor) drop-shadow(0 0 10px currentColor); }
        .seg-off { opacity: 0.05; fill: currentColor; }
        .seg-hidden { opacity: 0; }

        /* --- 科技風格 (Tech Mode) 專屬樣式 --- */
        .theme-tech-bg {
            background-color: #020617;
            background-image: 
                linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                radial-gradient(circle at center, transparent 0%, #020617 100%); /* 暗角效果 */
            background-size: 30px 30px, 30px 30px, 100% 100%;
        }
        
        /* 科技風字體：一般文字用 Share Tech Mono */
        .theme-tech-font {
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 0.05em;
        }

        /* 科技風數字：大數字用 Chakra Petch */
        .font-chakra {
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: 0.05em;
        }
        
        /* 高能光暈 (High-Energy Bloom) - 僅用於大時鐘等需要強調處 */
        .tech-bloom {
            text-shadow: 
                0 0 5px rgba(34, 211, 238, 0.9),
                0 0 15px rgba(34, 211, 238, 0.6),
                0 0 30px rgba(34, 211, 238, 0.3);
        }

        .tech-glow-text {
            filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.5));
        }

        .tech-border {
            position: relative;
            border: 1px solid rgba(34, 211, 238, 0.2);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.05);
        }
        /* 科技風切角效果 (視覺裝飾) */
        .tech-corner::before, .tech-corner::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .tech-corner::before { top: -1px; left: -1px; border-top-color: #22d3ee; border-left-color: #22d3ee; }
        .tech-corner::after { bottom: -1px; right: -1px; border-bottom-color: #22d3ee; border-right-color: #22d3ee; }

        /* 海洋風徑向漸層 */
        .theme-ocean-bg {
            background: radial-gradient(ellipse at center, #1e293b 0%, #020617 100%);
        }

        /* 主題選單動畫 */
        .theme-menu-enter { opacity: 0; transform: translateY(-10px) scale(0.95); }
        .theme-menu-enter-active { opacity: 1; transform: translateY(0) scale(1); transition: all 0.2s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- SVG 7-Segment Constants & Components ---
        // 傳統六角形風格 (Standard Hexagon with Gaps)
        const SEGMENTS = {
            a: "12,4 38,4 41,7 38,10 12,10 9,7",
            b: "42,8 45,11 45,35 42,38 39,35 39,11",
            c: "42,42 45,45 45,69 42,72 39,69 39,45",
            d: "12,70 38,70 41,73 38,76 12,76 9,73",
            e: "8,42 11,45 11,69 8,72 5,69 5,45",
            f: "8,8 11,11 11,35 8,38 5,35 5,11",
            g: "9,40 12,37 38,37 41,40 38,43 12,43"
        };

        const DIGIT_MAP = {
            0: ['a', 'b', 'c', 'd', 'e', 'f'],
            1: ['b', 'c'],
            2: ['a', 'b', 'd', 'e', 'g'],
            3: ['a', 'b', 'c', 'd', 'g'],
            4: ['b', 'c', 'f', 'g'],
            5: ['a', 'c', 'd', 'f', 'g'],
            6: ['a', 'c', 'd', 'e', 'f', 'g'],
            7: ['a', 'b', 'c'],
            8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
            9: ['a', 'b', 'c', 'd', 'f', 'g'],
            null: []
        };

        const SVGDigit = ({ value, color, showGhost, skew, glow = true }) => {
            const activeSegments = DIGIT_MAP[value] || [];
            const litClass = glow ? 'seg-lit-glow' : 'seg-lit-flat'; // 此處保留邏輯但暫時只用於上方大時鐘
            
            return (
                <svg viewBox="0 0 50 80" className="w-full h-full" style={{ color: color, transform: `skewX(${skew}deg)`, overflow: 'visible' }}>
                    {Object.keys(SEGMENTS).map(key => {
                        const isActive = activeSegments.includes(key);
                        const className = isActive ? litClass : (showGhost ? 'seg-off' : 'seg-hidden');
                        return <polygon key={key} points={SEGMENTS[key]} className={`segment ${className}`} fill="currentColor" />;
                    })}
                </svg>
            );
        };

        const SVGColon = ({ color, skew, glow = true }) => {
            const litClass = glow ? 'seg-lit-glow' : 'seg-lit-flat';
            return (
                <svg viewBox="0 0 20 80" className="w-full h-full animate-pulse" style={{ color: color, transform: `skewX(${skew}deg)` }}>
                    <circle cx="10" cy="25" r="4" fill="currentColor" className={litClass} />
                    <circle cx="10" cy="55" r="4" fill="currentColor" className={litClass} />
                </svg>
            );
        };

        // --- 設定常數 ---
        const DEFAULT_MESSAGES = {
            examRegular: ["考卷記得寫上班級姓名座號", "有問題舉手問老師，需要撿東西請監考老師幫忙", "不會寫的題目跳過寫會的題目", "耐心、細心、小心", "考卷有不會的問題等出題老師來了再問", "不要轉頭玩東西，寫完多檢查", "檢查完再檢查或趴下休息"],
            examSprint: ["檢查答案卡是否畫記清楚", "不要再修改沒把握的答案", "準備收拾文具", "檢查有無漏寫名字"],
            break: ["利用下課準備下個科目與文具用品", "提早上廁所喝水", "桌面淨空", "準備考試、收拾位置、坐在位置上"],
            end: ["考試結束，請停筆", "等老師點完再下課"]
        };

        // --- 主題系統定義 ---
        const THEMES = {
            DAY: {
                id: 'DAY', name: '標準日間', icon: '☀️',
                bg: 'bg-gray-100', cardBg: 'bg-white', text: 'text-gray-800', subText: 'text-gray-500',
                border: 'border-gray-300', borderActive: 'border-blue-400',
                inputBg: 'bg-white', inputBorder: 'border-gray-200',
                accent: 'bg-blue-100 text-blue-600',
                activeItem: 'bg-green-100',
                reminderBg: 'bg-[#fffdf0] border-gray-200', reminderText: 'text-gray-800', reminderLabel: 'bg-yellow-400 text-yellow-900',
                trackBase: '#e5e7eb',
                trackColors: { normal: 'stroke-green-500', warning: 'stroke-yellow-400', urgent: 'stroke-red-500' },
                trackTextColors: { normal: 'text-green-600', warning: 'text-yellow-600', urgent: 'text-red-500' },
                trackStyle: 'solid',
                modalBg: 'bg-white', modalText: 'text-gray-800', modalSubText: 'text-gray-500', modalBtn: 'bg-gray-50 hover:bg-gray-200 text-gray-800 border-gray-200',
                font: 'font-sans', isDark: false
            },
            NIGHT: {
                id: 'NIGHT', name: '標準夜間', icon: '🌙',
                bg: 'bg-[#111827]', cardBg: 'bg-[#1f2937]', text: 'text-gray-100', subText: 'text-gray-400',
                border: 'border-gray-700', borderActive: 'border-blue-500',
                inputBg: 'bg-gray-700', inputBorder: 'border-gray-600',
                accent: 'bg-gray-800 text-yellow-400',
                activeItem: 'bg-gray-800',
                reminderBg: 'bg-slate-800 border-yellow-500', reminderText: 'text-gray-100', reminderLabel: 'bg-yellow-500 text-slate-900',
                trackBase: '#374151',
                trackColors: { normal: 'stroke-green-400', warning: 'stroke-yellow-400', urgent: 'stroke-red-400' },
                trackTextColors: { normal: 'text-green-400', warning: 'text-yellow-400', urgent: 'text-red-400' },
                trackStyle: 'solid',
                modalBg: 'bg-[#1f2937]', modalText: 'text-gray-100', modalSubText: 'text-gray-400', modalBtn: 'bg-gray-700 hover:bg-gray-600 text-gray-200 border-gray-600',
                font: 'font-sans', isDark: true
            },
            FOREST: {
                id: 'FOREST', name: '森林護眼', icon: '🌲',
                bg: 'bg-[#f0fdf4]', cardBg: 'bg-[#dcfce7]', text: 'text-[#064e3b]', subText: 'text-[#059669]',
                border: 'border-[#86efac]', borderActive: 'border-[#10b981]',
                inputBg: 'bg-[#f0fdf4]', inputBorder: 'border-[#bbf7d0]',
                accent: 'bg-[#dcfce7] text-[#059669]',
                activeItem: 'bg-[#bbf7d0]',
                reminderBg: 'bg-[#f0fdf4] border-[#4ade80]', reminderText: 'text-[#064e3b]', reminderLabel: 'bg-[#22c55e] text-white',
                trackBase: '#dcfce7',
                trackColors: { normal: 'stroke-[#16a34a]', warning: 'stroke-[#eab308]', urgent: 'stroke-[#ef4444]' },
                trackTextColors: { normal: 'text-[#16a34a]', warning: 'text-[#ca8a04]', urgent: 'text-[#ef4444]' },
                trackStyle: 'solid',
                modalBg: 'bg-[#f0fdf4]', modalText: 'text-[#064e3b]', modalSubText: 'text-[#15803d]', modalBtn: 'bg-[#dcfce7] hover:bg-[#bbf7d0] text-[#064e3b] border-[#86efac]',
                font: 'font-sans', isDark: false
            },
            OCEAN: {
                id: 'OCEAN', name: '深海專注', icon: '🌊',
                bg: 'theme-ocean-bg', cardBg: 'bg-[#0f172a]/50 backdrop-blur-sm', text: 'text-[#e0f2fe]', subText: 'text-[#94a3b8]',
                border: 'border-[#1e293b]', borderActive: 'border-[#38bdf8]',
                inputBg: 'bg-[#0f172a]/80', inputBorder: 'border-[#334155]',
                accent: 'bg-[#1e293b] text-[#38bdf8]',
                activeItem: 'bg-[#1e293b] border-l-4 border-[#38bdf8]',
                reminderBg: 'bg-[#0f172a]/80 border-[#0ea5e9]', reminderText: 'text-[#e0f2fe]', reminderLabel: 'bg-[#0ea5e9] text-white',
                trackBase: '#1e293b',
                trackColors: { normal: 'stroke-[#22d3ee]', warning: 'stroke-[#fbbf24]', urgent: 'stroke-[#f43f5e]' },
                trackTextColors: { normal: 'text-[#22d3ee]', warning: 'text-[#fbbf24]', urgent: 'text-[#f43f5e]' },
                trackStyle: 'solid',
                modalBg: 'bg-[#0f172a]/95 backdrop-blur', modalText: 'text-[#e0f2fe]', modalSubText: 'text-[#94a3b8]', modalBtn: 'bg-[#1e293b] hover:bg-[#334155] text-[#e0f2fe] border-[#334155]',
                font: 'font-sans', isDark: true
            },
            TECH: {
                id: 'TECH', name: '科技面板', icon: '🚀',
                bg: 'theme-tech-bg', cardBg: 'bg-[#020617]/80 backdrop-blur-sm', text: 'text-[#22d3ee] tech-glow-text', subText: 'text-cyan-700',
                border: 'border-cyan-900/50', borderActive: 'border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.3)]',
                inputBg: 'bg-[#0f172a]/50', inputBorder: 'border-cyan-900',
                accent: 'bg-cyan-950/50 text-cyan-300 border border-cyan-800',
                activeItem: 'bg-cyan-950/30 tech-corner border border-cyan-500/30',
                reminderBg: 'bg-[#020617]/90 border-cyan-700', reminderText: 'text-cyan-100 tech-glow-text', reminderLabel: 'bg-cyan-900/80 text-cyan-300 border border-cyan-500',
                trackBase: '#0f172a',
                // 科技風：虛線跑道 (遮罩實現)，顏色恢復直覺的 綠/黃/紅
                trackColors: { normal: 'stroke-[#22c55e] drop-shadow-[0_0_5px_rgba(34,197,94,0.8)]', warning: 'stroke-[#eab308] drop-shadow-[0_0_5px_rgba(234,179,8,0.8)]', urgent: 'stroke-[#ef4444] drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]' },
                trackTextColors: { normal: 'text-[#22d3ee]', warning: 'text-[#facc15]', urgent: 'text-[#f87171]' },
                trackStyle: 'segmented', // 標記為分段式
                modalBg: 'bg-[#020617]/90 backdrop-blur-xl border border-cyan-500/50 shadow-[0_0_20px_rgba(34,211,238,0.2)]', modalText: 'text-[#22d3ee] tech-glow-text', modalSubText: 'text-cyan-700', modalBtn: 'bg-[#1e293b] hover:bg-cyan-900/50 text-[#22d3ee] border border-cyan-900 shadow-[0_0_5px_rgba(34,211,238,0.1)]',
                font: 'theme-tech-font', isDark: true
            }
        };

        const processImageFile = async (file) => {
            const TARGET_WIDTH = 1920; 
            try {
                const bitmap = await createImageBitmap(file);
                let width = bitmap.width;
                let height = bitmap.height;
                if (width > TARGET_WIDTH || height > TARGET_WIDTH) {
                    const ratio = Math.min(TARGET_WIDTH / width, TARGET_WIDTH / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                let canvas, ctx;
                if (window.OffscreenCanvas) {
                    canvas = new OffscreenCanvas(width, height);
                    ctx = canvas.getContext('2d');
                } else {
                    canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    ctx = canvas.getContext('2d');
                }
                ctx.drawImage(bitmap, 0, 0, width, height);
                bitmap.close();
                const blob = await (canvas.convertToBlob 
                    ? canvas.convertToBlob({ type: 'image/jpeg', quality: 0.85 }) 
                    : new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85)));
                return { url: URL.createObjectURL(blob), name: file.name };
            } catch (err) {
                console.warn("Fast bitmap failed, fallback to raw", err);
                return { url: URL.createObjectURL(file), name: file.name };
            }
        };

        const TimeKeypadModal = ({ isOpen, onClose, initialTime, onConfirm, theme }) => {
            if (!isOpen) return null;
            const [digits, setDigits] = useState([]);
            useEffect(() => { if (isOpen) setDigits([]); }, [isOpen]);

            const handleNumClick = (num) => {
                if (digits.length >= 4) return;
                const newDigits = [...digits, num];
                if (newDigits.length === 1 && num > 2) return;
                if (newDigits.length === 2 && newDigits[0] === 2 && num > 3) return;
                if (newDigits.length === 3 && num > 5) return;
                setDigits(newDigits);
                if (newDigits.length === 4) {
                    const timeStr = `${newDigits[0]}${newDigits[1]}:${newDigits[2]}${newDigits[3]}`;
                    setTimeout(() => { onConfirm(timeStr); onClose(); }, 200); 
                }
            };
            const handleBackspace = () => setDigits(digits.slice(0, -1));
            const displayDigits = [0, 1, 2, 3].map(i => digits[i] !== undefined ? digits[i] : '-');

            // 依主題動態樣式
            const displayBg = theme.id === 'TECH' ? 'bg-[#0f172a] border-cyan-800 text-[#22d3ee]' : (theme.id === 'FOREST' ? 'bg-[#f0fdf4] border-[#86efac] text-[#059669]' : (theme.id === 'OCEAN' ? 'bg-[#0f172a] border-blue-800 text-blue-200' : 'bg-gray-100 border-blue-100 text-blue-600'));
            
            return (
                <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center backdrop-blur-sm" onClick={onClose}>
                    <div className="translate-x-[-160px] translate-y-[100px]" onClick={e => e.stopPropagation()}>
                        <div className={`${theme.modalBg} p-6 rounded-2xl shadow-2xl w-[320px] max-w-[90vw] modal-animate ${theme.font} border ${theme.border}`}>
                            <div className="text-center mb-4">
                                <div className={`${theme.modalSubText} text-sm mb-1`}>請輸入時間 (24小時制)</div>
                                <div className={`flex justify-center items-center gap-1 text-4xl font-black font-mono tracking-widest p-3 rounded-xl border-2 ${displayBg}`}>
                                    <span>{displayDigits[0]}</span><span>{displayDigits[1]}</span><span className="opacity-50 text-2xl">:</span><span>{displayDigits[2]}</span><span>{displayDigits[3]}</span>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3 mb-4">
                                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                    <button key={num} onClick={() => handleNumClick(num)} className={`text-2xl font-bold py-3 rounded-lg transition-all ${theme.modalBtn} ${theme.id !== 'TECH' ? 'btn-press shadow-sm' : 'active:scale-95'}`}>{num}</button>
                                ))}
                                <button onClick={onClose} className={`font-bold rounded-lg border text-lg ${theme.id==='TECH'?'bg-red-900/20 text-red-400 border-red-900 hover:bg-red-900/40':(theme.id==='FOREST'?'bg-red-50 text-red-600 border-red-200 hover:bg-red-100':'bg-red-50 text-red-600 border-red-200 hover:bg-red-100 btn-press')}`}>取消</button>
                                <button onClick={() => handleNumClick(0)} className={`text-2xl font-bold py-3 rounded-lg transition-all ${theme.modalBtn} ${theme.id !== 'TECH' ? 'btn-press shadow-sm' : 'active:scale-95'}`}>0</button>
                                <button onClick={handleBackspace} className={`font-bold rounded-lg border text-xl ${theme.id==='TECH'?'bg-orange-900/20 text-orange-400 border-orange-900 hover:bg-orange-900/40':(theme.id==='FOREST'?'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100':'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100 btn-press')}`}>⌫</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // [MODIFIED] TimeDisplayInput 還原為文字模式 (取消 SVG 列表)
        // 並針對 Tech 模式移除 tech-bloom，只保留 font-chakra 字體風格
        const TimeDisplayInput = React.memo(({ value, onClick, textSizeClass, activeColorClass, theme }) => {
            const techDigitClass = theme.id === 'TECH' ? 'font-chakra' : ''; // 移除 tech-bloom 以取消光暈
            
            return (
                <div className="relative w-full h-full flex items-center justify-center min-h-[50px] cursor-pointer group" onClick={onClick}>
                    <span className={`${textSizeClass || 'text-[4.5vw]'} font-black leading-none ${activeColorClass ? activeColorClass : theme.text} ${techDigitClass} tracking-tight z-0 pointer-events-none transition-all duration-300`}>{value}</span>
                    <div className="absolute inset-0 w-full h-full z-20"></div>
                </div>
            );
        });

        const toMins = (t) => {
            if (!t) return 0;
            const parts = t.split(':');
            if (parts.length < 2) return 0;
            const [h, m] = parts.map(Number);
            if (isNaN(h) || isNaN(m)) return 0;
            return h * 60 + m;
        };
        const toTime = (m) => {
            let h = Math.floor(m / 60) % 24;
            let min = m % 60;
            return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        };

        const SettingsModal = ({ isOpen, onClose, messages, onSave, theme }) => {
            if (!isOpen) return null;
            const [localMsgs, setLocalMsgs] = useState(messages);
            const [tab, setTab] = useState('exam');
            const handleChange = (cat, val) => setLocalMsgs(p => ({ ...p, [cat]: val.split('\n') }));
            const handleReset = () => setLocalMsgs(JSON.parse(JSON.stringify(DEFAULT_MESSAGES)));

            // 根據主題設定樣式
            const tabActive = theme.id === 'TECH' ? 'bg-[#1e293b] text-[#22d3ee] border-t-4 border-[#22d3ee]' : (theme.id === 'FOREST' ? 'bg-[#dcfce7] text-[#064e3b] border-t-4 border-[#16a34a]' : (theme.id === 'OCEAN' ? 'bg-[#1e293b] text-blue-200 border-t-4 border-blue-400' : 'bg-white text-blue-600 border-t-4 border-blue-500'));
            const tabInactive = theme.modalSubText + ' hover:opacity-80';
            const textAreaClass = theme.id === 'TECH' ? 'bg-[#0f172a] border-cyan-800 text-[#22d3ee] focus:border-cyan-400' : (theme.id === 'FOREST' ? 'bg-[#f0fdf4] border-[#86efac] text-[#064e3b] focus:border-[#16a34a]' : (theme.id === 'OCEAN' ? 'bg-[#0f172a] border-blue-900 text-blue-100 focus:border-blue-400' : 'bg-gray-50 border-gray-200 text-gray-800 focus:border-blue-400'));

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" onClick={onClose}>
                    <div className={`${theme.modalBg} w-[90%] max-w-4xl h-[85%] rounded-2xl shadow-2xl flex flex-col overflow-hidden modal-animate border ${theme.border} ${theme.font}`} onClick={e => e.stopPropagation()}>
                        <div className={`p-4 border-b ${theme.border} flex justify-between items-center bg-opacity-50`}>
                            <h2 className={`text-xl font-bold flex items-center gap-2 ${theme.modalText}`}>⚙️ 提醒設定</h2>
                            <button onClick={onClose} className={`text-2xl font-bold ${theme.modalSubText} hover:text-red-500`}>&times;</button>
                        </div>
                        <div className={`flex border-b ${theme.border}`}>
                            {['exam', 'break', 'end'].map(t => (
                                <button key={t} onClick={() => setTab(t)} className={`flex-1 py-3 font-bold text-lg transition-colors ${tab === t ? tabActive : tabInactive}`}>{t === 'exam' ? '考試中' : t === 'break' ? '下課/準備' : '交卷'}</button>
                            ))}
                        </div>
                        <div className={`flex-1 p-6 overflow-y-auto ${theme.id === 'TECH' || theme.id === 'OCEAN' ? 'bg-transparent' : theme.modalBg}`}>
                            {tab === 'exam' ? (
                                <div className="flex flex-col h-full">
                                    <div className={`mb-4 text-sm font-bold p-2 rounded border flex items-center gap-2 ${theme.id==='TECH'?'bg-yellow-900/20 text-yellow-400 border-yellow-700':(theme.id==='FOREST'?'bg-yellow-50 text-yellow-800 border-yellow-200':'bg-yellow-50 text-gray-500 border-yellow-200')}`}><span>💡</span><span>提醒切換頻率：一般時段約 4 分鐘輪播一次，最後 10 分鐘 (衝刺) 約 1.5 分鐘輪播一次。</span></div>
                                    <div className="grid grid-cols-2 gap-6 flex-1 min-h-0">
                                        <div className="flex flex-col h-full"><label className={`font-bold mb-2 ${theme.id==='TECH'?'text-blue-400':'text-blue-600'}`}>常規提醒 (剩10分前)</label><textarea className={`flex-1 p-4 border-2 rounded-xl outline-none resize-none text-lg ${textAreaClass}`} value={localMsgs.examRegular.join('\n')} onChange={e => handleChange('examRegular', e.target.value)} /></div>
                                        <div className="flex flex-col h-full"><label className="font-bold text-red-500 mb-2">最後衝刺 (倒數10分)</label><textarea className={`flex-1 p-4 border-2 rounded-xl outline-none resize-none text-lg ${textAreaClass}`} value={localMsgs.examSprint.join('\n')} onChange={e => handleChange('examSprint', e.target.value)} /></div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col h-full">
                                    <label className={`font-bold mb-2 text-lg ${tab === 'break' ? 'text-green-600' : theme.modalSubText}`}>{tab === 'break' ? '下課與準備提醒' : '交卷提醒'}</label>
                                    <textarea className={`flex-1 p-4 border-2 rounded-xl outline-none resize-none text-lg ${textAreaClass}`} value={localMsgs[tab].join('\n')} onChange={e => handleChange(tab, e.target.value)} />
                                </div>
                            )}
                        </div>
                        <div className={`p-4 border-t ${theme.border} flex justify-between gap-3 bg-opacity-20`}>
                             <button onClick={handleReset} className={`px-6 py-2 rounded-lg border font-bold ${theme.id==='TECH'?'border-red-900 text-red-400 hover:bg-red-900/30':(theme.id==='FOREST'?'border-red-200 text-red-600 hover:bg-red-50':'border-red-200 text-red-600 hover:bg-red-50')}`}>↺ 回復預設值</button>
                             <div className="flex gap-3">
                                <button onClick={onClose} className={`px-6 py-2 rounded-lg border font-bold ${theme.modalBtn}`}>取消</button>
                                <button onClick={() => { onSave(localMsgs); onClose(); }} className="px-6 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-lg active:scale-95">儲存設定</button>
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [now, setNow] = useState(new Date());
            const [offset, setOffset] = useState(() => parseInt(localStorage.getItem('offset_v5') || 0, 10));
            const [messageSettings, setMessageSettings] = useState(() => JSON.parse(localStorage.getItem('msgs_v5') || JSON.stringify(DEFAULT_MESSAGES)));
            const [examSettings, setExamSettings] = useState(() => JSON.parse(localStorage.getItem('exams_v5')) || [
                { subject: "國語", start: "08:40", end: "09:20" }, { subject: "數學", start: "10:10", end: "10:50" }
            ]);
            const [attendance, setAttendance] = useState(() => JSON.parse(localStorage.getItem('att_v5')) || { shouldArrive: "", actualArrive: "", absentList: "" });
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [keypadState, setKeypadState] = useState({ isOpen: false, index: null, field: null, initialTime: '' });
            const [viewMode, setViewMode] = useState(0);
            const [currentTheme, setCurrentTheme] = useState(() => localStorage.getItem('theme_v6') || 'DAY');
            const [isThemeMenuOpen, setIsThemeMenuOpen] = useState(false);
            const [mediaResources, setMediaResources] = useState({});
            const [avPlayer, setAvPlayer] = useState({ rowIndex: null, isPlaying: false });
            const [galleryViewer, setGalleryViewer] = useState({ rowIndex: null, index: 0, isOpen: false, isEnhanced: false });

            const audioRefs = useRef({}); 
            const videoRef = useRef(null); 
            const wakeLockRef = useRef(null);
            const speechFlagsRef = useRef({});
            const interruptedMediaRef = useRef(null); 
            const prevStatusTypeRef = useRef(null);
            const prevSegmentRef = useRef(-1); 

            useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
            useEffect(() => { localStorage.setItem('offset_v5', offset); }, [offset]);
            useEffect(() => { localStorage.setItem('exams_v5', JSON.stringify(examSettings)); }, [examSettings]);
            useEffect(() => { localStorage.setItem('att_v5', JSON.stringify(attendance)); }, [attendance]);
            useEffect(() => { localStorage.setItem('msgs_v5', JSON.stringify(messageSettings)); }, [messageSettings]);
            useEffect(() => { localStorage.setItem('theme_v6', currentTheme); }, [currentTheme]);

            useEffect(() => {
                const requestLock = async () => { if ('wakeLock' in navigator && !wakeLockRef.current) wakeLockRef.current = await navigator.wakeLock.request('screen').catch(()=>{}); };
                document.addEventListener('click', requestLock, { once: true });
                document.addEventListener('touchstart', requestLock, { once: true });
            }, []);

            const adjustedNow = useMemo(() => new Date(now.getTime() + offset), [now, offset]);
            const currentStatus = useMemo(() => {
                const nowMs = adjustedNow.getTime();
                const getMs = (s) => { if(!s) return 0; const [h,m] = s.split(':'); const d = new Date(adjustedNow); d.setHours(h,m,0,0); return d.getTime(); };

                for (let i = 0; i < examSettings.length; i++) {
                    const s = getMs(examSettings[i].start);
                    const e = getMs(examSettings[i].end);
                    const cEnd = e + 180000; 
                    if (nowMs >= s && nowMs < e) return { type: 'exam', index: i, label: examSettings[i].subject, start: s, end: e, dur: e - s };
                    if (nowMs >= e && nowMs < cEnd) return { type: 'collection', index: i, label: '交卷', start: e, end: cEnd, dur: 180000 };
                }
                const firstStart = getMs(examSettings[0].start);
                if (nowMs < firstStart) return { type: 'break', label: '準備中', start: firstStart - 1200000, end: firstStart, dur: 1200000 };
                for (let i = 0; i < examSettings.length - 1; i++) {
                    const currEnd = getMs(examSettings[i].end);
                    const nextStart = getMs(examSettings[i+1].start);
                    if (nowMs >= currEnd && nowMs < nextStart) return { type: 'break', label: '下課休息', start: currEnd, end: nextStart, dur: nextStart - currEnd };
                }
                const lastEnd = getMs(examSettings[examSettings.length-1].end);
                return { type: 'end_final', label: '考試結束', start: lastEnd + 180000, end: nowMs + 3600000, dur: 0, isFinal: true };
            }, [adjustedNow, examSettings]);

            const speak = useCallback((text, repeat = 1) => {
                if (!('speechSynthesis' in window)) return;
                let activeMedia = null;
                if (avPlayer.isPlaying && avPlayer.rowIndex !== null) {
                    const res = mediaResources[avPlayer.rowIndex]?.av;
                    if (res) {
                        if (res.type === 'audio' && audioRefs.current[avPlayer.rowIndex]) activeMedia = { type: 'audio', el: audioRefs.current[avPlayer.rowIndex] };
                        else if (res.type === 'video' && videoRef.current) activeMedia = { type: 'video', el: videoRef.current };
                    }
                }
                if (activeMedia) { activeMedia.el.pause(); interruptedMediaRef.current = activeMedia; }
                window.speechSynthesis.cancel();
                for (let i = 0; i < repeat; i++) {
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'zh-TW';
                    if (i === repeat - 1) {
                        u.onend = () => {
                            const interrupted = interruptedMediaRef.current;
                            if (interrupted) { interrupted.el.play().catch(e => console.log("Resume failed", e)); interruptedMediaRef.current = null; }
                        };
                    }
                    window.speechSynthesis.speak(u);
                }
            }, [avPlayer, mediaResources]);

            useEffect(() => {
                const currentMs = adjustedNow.getTime();
                const statusType = currentStatus ? currentStatus.type : null;
                const flags = speechFlagsRef.current;
                if (prevStatusTypeRef.current === 'exam' && statusType !== 'exam') speak("考試結束，請停筆", 2);
                prevStatusTypeRef.current = statusType;
                if (!currentStatus) return;
                const key = `${currentStatus.type}_${currentStatus.index || 0}_${currentStatus.start}`;
                if (flags.key !== key) speechFlagsRef.current = { key, s: false, m15: false, m5: false, pre: false, half: false };
                const f = speechFlagsRef.current;
                if (currentStatus.type === 'exam') {
                    if (!f.s) { const durationMins = Math.round(currentStatus.dur / 60000); speak(`${currentStatus.label}考試開始，總共${durationMins}分鐘。請寫上班級座號姓名。`, 1); f.s = true; }
                    
                    // 新增功能: 50分鐘以上考試過半提醒
                    const totalMins = Math.round(currentStatus.dur / 60000);
                    if (totalMins >= 50 && !f.half) {
                        const elapsed = currentMs - currentStatus.start;
                        if (elapsed >= currentStatus.dur / 2) {
                            speak("時間已經過一半，請把握時間", 1);
                            f.half = true;
                        }
                    }

                    const remainingMs = currentStatus.end - currentMs;
                    if (remainingMs <= 900000 && remainingMs > 300000 && !f.m15) { speak("剩下15分鐘，請把握時間", 1); f.m15 = true; }
                    if (remainingMs <= 300000 && remainingMs > 0 && !f.m5) { speak("考試即將結束，請做最後檢查", 1); f.m5 = true; }
                } else if (currentStatus.type === 'break') {
                    const remainingMs = currentStatus.end - currentMs;
                    const totalBreakMinutes = Math.round(currentStatus.dur / 60000);
                    if (!currentStatus.isFinal && remainingMs <= 300000 && remainingMs > 0 && !f.pre) { 
                        if (totalBreakMinutes > 5) {
                            speak("回到座位，準備考試", 2); 
                        }
                        f.pre = true; 
                    }
                }
            }, [adjustedNow, currentStatus, speak]);

            const handleAVSelect = (index, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const type = file.type.startsWith('video') ? 'video' : 'audio';
                const url = URL.createObjectURL(file);
                setMediaResources(p => {
                    if (p[index]?.av) URL.revokeObjectURL(p[index].av.url);
                    return { ...p, [index]: { ...p[index], av: { url, type, name: file.name } } };
                });
                e.target.value = '';
            };

            const handleGallerySelect = async (index, e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                const placeholders = files.map(f => ({ name: f.name, url: null, loading: true }));
                setMediaResources(p => ({ ...p, [index]: { ...p[index], gallery: [...(p[index]?.gallery || []), ...placeholders] } }));
                const processed = await Promise.all(files.map(f => processImageFile(f)));
                setMediaResources(p => {
                    const current = p[index]?.gallery || [];
                    const clean = current.filter(i => !i.loading);
                    return { ...p, [index]: { ...p[index], gallery: [...clean, ...processed] } };
                });
                e.target.value = '';
            };

            const handleDelete = (index, type) => {
                setMediaResources(p => {
                    const res = p[index];
                    if (!res) return p;
                    if (type === 'av' && res.av) { URL.revokeObjectURL(res.av.url); if (avPlayer.rowIndex === index) setAvPlayer({ rowIndex: null, isPlaying: false }); return { ...p, [index]: { ...res, av: null } }; }
                    if (type === 'gallery' && res.gallery) { res.gallery.forEach(i => URL.revokeObjectURL(i.url)); return { ...p, [index]: { ...res, gallery: [] } }; }
                    return p;
                });
            };

            const toggleAV = (index) => {
                const res = mediaResources[index]?.av;
                if (!res) return;
                if (avPlayer.rowIndex === index && avPlayer.isPlaying) {
                    if (res.type === 'audio' && audioRefs.current[index]) audioRefs.current[index].pause();
                    if (res.type === 'video') setAvPlayer({ rowIndex: null, isPlaying: false }); else setAvPlayer(p => ({ ...p, isPlaying: false }));
                } else {
                    if (avPlayer.rowIndex !== null && avPlayer.rowIndex !== index) { if(audioRefs.current[avPlayer.rowIndex]) audioRefs.current[avPlayer.rowIndex].pause(); }
                    if (res.type === 'audio') { audioRefs.current[index].play(); setAvPlayer({ rowIndex: index, isPlaying: true }); } else { setAvPlayer({ rowIndex: index, isPlaying: true }); }
                }
            };

            const touchStartRef = useRef(null);
            const handleTouchMove = (e) => {
                if (!touchStartRef.current) return;
                const diff = touchStartRef.current - e.touches[0].clientX;
                if (Math.abs(diff) > 50) {
                    const list = mediaResources[galleryViewer.rowIndex]?.gallery || [];
                    if (diff > 0 && galleryViewer.index < list.length - 1) setGalleryViewer(p => ({ ...p, index: p.index + 1 }));
                    else if (diff < 0 && galleryViewer.index > 0) setGalleryViewer(p => ({ ...p, index: p.index - 1 }));
                    touchStartRef.current = null;
                }
            };

            const adjustTime = (seconds) => setOffset(prev => prev + (seconds * 1000));
            const handleExtension = (addMinutes) => {
                if (!currentStatus || currentStatus.type !== 'exam') return;
                const currentIndex = currentStatus.index;
                let newSettings = JSON.parse(JSON.stringify(examSettings));
                let currentEnd = toMins(newSettings[currentIndex].end);
                currentEnd += addMinutes;
                newSettings[currentIndex].end = toTime(currentEnd);
                for (let i = currentIndex + 1; i < newSettings.length; i++) {
                    let prevEnd = toMins(newSettings[i-1].end);
                    let currStart = toMins(newSettings[i].start);
                    let currEnd = toMins(newSettings[i].end);
                    let duration = currEnd - currStart;
                    if (currStart - prevEnd < 5) { let newStart = prevEnd + 5; newSettings[i].start = toTime(newStart); newSettings[i].end = toTime(newStart + duration); } else { break; }
                }
                setExamSettings(newSettings);
                if(speechFlagsRef.current) { speechFlagsRef.current.m15 = false; speechFlagsRef.current.m5 = false; }
            };

            const themeStyle = THEMES[currentTheme];

            const progressInfo = useMemo(() => {
                if (!currentStatus) return { pct: 0, status: 'normal', text: '等待中' };
                
                let pct = 0;
                let status = 'normal';
                let text = '';

                if (currentStatus.type === 'collection') {
                    status = 'urgent'; 
                    text = "考試結束，請停筆交卷";
                    
                    if (currentStatus.index < examSettings.length - 1) {
                        const nextExamStartStr = examSettings[currentStatus.index + 1].start;
                        const [nh, nm] = nextExamStartStr.split(':').map(Number);
                        const nextStart = new Date(adjustedNow);
                        nextStart.setHours(nh, nm, 0, 0);
                        const nextStartMs = nextStart.getTime();
                        
                        const breakStartMs = currentStatus.start; 
                        
                        const totalBreak = nextStartMs - breakStartMs;
                        const remaining = nextStartMs - adjustedNow.getTime();
                        
                        if (totalBreak > 0) {
                            pct = Math.max(0, Math.min(100, (remaining / totalBreak) * 100));
                        } else {
                            pct = 0;
                        }
                    } else {
                        pct = 0;
                    }
                } 
                else {
                    const rem = currentStatus.end - adjustedNow.getTime();
                    const total = currentStatus.dur;
                    pct = Math.max(0, Math.min(100, (rem / total) * 100));

                    if (currentStatus.type === 'exam') {
                        text = "考試開始";
                        if (rem <= total / 2) { status = 'warning'; text = "考試時間剩下一半"; }
                        if (rem <= 900000) { status = 'urgent'; text = "考試時間不到15分鐘"; }
                        if (rem <= 300000) { text = "考試即檢查，請做最後檢查"; }
                    } else {
                        if (currentStatus.isFinal) {
                            status = 'normal'; text = "考試結束";
                        } else {
                            if (rem > 480000) { text = "休息時間"; }
                            else if (rem > 300000) { status = 'warning'; text = "快去上廁所喝水"; }
                            else { status = 'urgent'; text = "回到座位，準備考試"; }
                        }
                    }
                }
                
                return { pct, status, text };
            }, [adjustedNow, currentStatus, examSettings]);

            const reminderText = useMemo(() => {
                if (!currentStatus) return "非考試時段";
                const elapsed = (adjustedNow.getTime() - currentStatus.start) / 60000;
                let msgs = [];
                let interval = 4;
                if (currentStatus.type === 'exam') {
                    const remMin = (currentStatus.end - adjustedNow.getTime()) / 60000;
                    if (remMin <= 10) { msgs = messageSettings.examSprint; interval = 1.5; } else { msgs = messageSettings.examRegular; interval = 4; }
                } else if (currentStatus.type === 'break') { msgs = messageSettings.break; interval = 1; } 
                else if (currentStatus.type === 'collection') { msgs = messageSettings.end; interval = 1.5; } 
                else if (currentStatus.type === 'end_final') { return "考試結束"; }
                if (!msgs || !msgs.length) return "...";
                return msgs[Math.floor(elapsed / interval) % msgs.length] || msgs[0];
            }, [adjustedNow, currentStatus, messageSettings]);

            const updateSetting = (index, field, value) => {
                let newSettings = JSON.parse(JSON.stringify(examSettings));
                newSettings[index][field] = value;
                let s1 = toMins(newSettings[0].start);
                let e1 = toMins(newSettings[0].end);
                if (e1 - s1 < 20) { e1 = s1 + 20; newSettings[0].end = toTime(e1); }
                if (newSettings[1]) {
                    let s2 = toMins(newSettings[1].start);
                    let e2 = toMins(newSettings[1].end);
                    if (s2 - e1 < 5) { s2 = e1 + 5; newSettings[1].start = toTime(s2); }
                    if (e2 - s2 < 20) { e2 = s2 + 20; newSettings[1].end = toTime(e2); }
                }
                setExamSettings(newSettings);
            };

            const openKeypad = (index, field, currentVal) => setKeypadState({ isOpen: true, index, field, initialTime: currentVal });
            const onKeypadConfirm = (newTime) => { if (keypadState.index !== null && keypadState.field) updateSetting(keypadState.index, keypadState.field, newTime); };

            const isSimple = viewMode > 0;
            const currentTrackColor = progressInfo.text === '考試結束' && currentStatus?.isFinal ? 'stroke-gray-400' : themeStyle.trackColors[progressInfo.status];
            const currentTrackTextColor = progressInfo.text === '考試結束' && currentStatus?.isFinal ? themeStyle.subText : themeStyle.trackTextColors[progressInfo.status];

            const techGlowClass = themeStyle.id === 'TECH' ? 'drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]' : '';
            const bigClockClass = themeStyle.id === 'TECH' ? 'font-chakra tech-bloom tech-glow-text' : '';

            let trackOffset = 0;
            let currentSegments = 0;
            let isFlickering = false; 
            let isForceHidden = false;

            if (themeStyle.trackStyle === 'segmented') {
                const totalSegments = 40; 
                currentSegments = Math.ceil((progressInfo.pct / 100) * totalSegments); 
                const segmentPct = currentSegments / totalSegments; 
                trackOffset = 100 * (1 - segmentPct);

                if (currentStatus && currentStatus.type !== 'collection' && currentStatus.type !== 'end_final') {
                    const rem = currentStatus.end - adjustedNow.getTime();
                    const total = currentStatus.dur;
                    const segDur = total / 40;
                    if (rem > 0 && (rem % segDur) <= 3000) {
                        isFlickering = true;
                    }
                }
                
                if (progressInfo.pct === 0 && (currentStatus?.type === 'collection' || currentStatus?.type === 'end_final')) {
                    isForceHidden = true;
                }
            } else {
                trackOffset = 100 - progressInfo.pct;
                if (progressInfo.pct === 0 && (currentStatus?.type === 'collection' || currentStatus?.type === 'end_final')) {
                    isForceHidden = true;
                }
            }

            return (
                <div className={`flex flex-col h-screen w-screen overflow-hidden transition-colors duration-300 ${themeStyle.bg} ${themeStyle.font}`}>
                    <video className="hidden" />

                    {/* === 上方 === */}
                    <div className={`w-full ${themeStyle.cardBg} ${themeStyle.id === 'TECH' ? 'tech-border' : `border-b-4 ${themeStyle.border}`} flex flex-row relative shadow-lg z-10 transition-all duration-500 ${isSimple ? 'h-[45vh]' : 'h-[33vh]'}`}>
                        
                        {/* 左: 時間 */}
                        <div className={`w-1/3 flex flex-col items-center justify-between border-r ${themeStyle.border} group px-2 relative py-2`}>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1 opacity-0 group-hover:opacity-100 transition-opacity w-full max-w-[240px]">
                                <div className="flex justify-between items-center gap-1">
                                    <button onClick={() => adjustTime(-60)} className={`flex-1 py-1 rounded text-xs transition-colors ${themeStyle.accent}`}>-1分</button>
                                    <button onClick={() => adjustTime(60)} className={`flex-1 py-1 rounded text-xs transition-colors ${themeStyle.accent}`}>+1分</button>
                                </div>
                                <div className="flex justify-between items-center gap-1">
                                    <button onClick={() => adjustTime(-1)} className={`flex-1 py-1 rounded text-xs transition-colors ${themeStyle.accent}`}>-1秒</button>
                                    <button onClick={() => adjustTime(1)} className={`flex-1 py-1 rounded text-xs transition-colors ${themeStyle.accent}`}>+1秒</button>
                                </div>
                            </div>

                            {/* [MODIFIED] 主時鐘顯示區域：科技模式使用 SVG Digit，其他模式使用文字 */}
                            {/* [FIXED] 增加 max-w-full 與 justify-center 避免精簡模式下 SVG 爆版 */}
                            {/* [FIXED] 使用 width-driven 佈局邏輯，設定 w-% 而非 h-full，並加上 max-h-full 避免溢出 */}
                            {currentTheme === 'TECH' ? (
                                <div className="flex-1 flex items-center justify-center gap-1 w-full h-full max-w-full px-4 py-2 overflow-hidden">
                                    {/* 4個數字寬度約佔 22%，冒號 9%，總和 < 100% 留邊距 */}
                                    <div className="w-[22%] max-h-full aspect-[50/80]"><SVGDigit value={Math.floor(adjustedNow.getHours() / 10)} color="#22d3ee" showGhost={true} skew={-20} /></div>
                                    <div className="w-[22%] max-h-full aspect-[50/80]"><SVGDigit value={adjustedNow.getHours() % 10} color="#22d3ee" showGhost={true} skew={-20} /></div>
                                    
                                    <div className="w-[9%] max-h-full aspect-[20/80] mx-1"><SVGColon color="#22d3ee" skew={-20} /></div>
                                    
                                    <div className="w-[22%] max-h-full aspect-[50/80]"><SVGDigit value={Math.floor(adjustedNow.getMinutes() / 10)} color="#22d3ee" showGhost={true} skew={-20} /></div>
                                    <div className="w-[22%] max-h-full aspect-[50/80]"><SVGDigit value={adjustedNow.getMinutes() % 10} color="#22d3ee" showGhost={true} skew={-20} /></div>
                                </div>
                            ) : (
                                <span className={`${isSimple ? 'text-[11vw]' : 'text-[6.5vw]'} font-black leading-none ${themeStyle.text} tracking-tighter tabular-nums transition-all duration-500 flex-1 flex items-center justify-center`}>
                                    {adjustedNow.getHours().toString().padStart(2,'0')}:{adjustedNow.getMinutes().toString().padStart(2,'0')}
                                </span>
                            )}
                            
                            <div className="flex flex-col items-center w-full pb-1 z-30">
                                <span className={`text-[1.5vw] font-bold tracking-widest mb-1 ${themeStyle.subText}`}>現在時間</span>
                                <div className="flex gap-1 flex-wrap justify-center items-center relative">
                                    <button onClick={()=>setOffset(0)} className={`rounded px-2 py-1 text-xs font-bold transition-opacity ${themeStyle.accent}`}>校準</button>
                                    <button onClick={()=>setViewMode((viewMode + 1) % 3)} className={`rounded px-2 py-1 text-xs font-bold transition-all shadow-sm ${themeStyle.accent}`}>
                                        {viewMode === 0 ? '精簡(科目)' : (viewMode === 1 ? '精簡(提醒)' : '完整版')}
                                    </button>
                                    <button onClick={() => setIsSettingsOpen(true)} className={`rounded px-2 py-1 text-xs font-bold transition-all ${themeStyle.accent}`}>⚙️</button>
                                    
                                    <div className="relative">
                                        <button onClick={() => setIsThemeMenuOpen(!isThemeMenuOpen)} className={`rounded px-2 py-1 text-xs font-bold transition-all ${themeStyle.accent}`}>🎨</button>
                                        {isThemeMenuOpen && (
                                            <div className={`absolute bottom-full left-0 mb-2 p-2 rounded-xl flex gap-2 shadow-xl border theme-menu-enter theme-menu-enter-active z-50 ${themeStyle.cardBg} ${themeStyle.border}`}>
                                                {Object.values(THEMES).map(t => (
                                                    <button key={t.id} onClick={() => { setCurrentTheme(t.id); setIsThemeMenuOpen(false); }} className={`w-8 h-8 rounded-full flex items-center justify-center text-lg hover:scale-110 transition border-2 ${currentTheme === t.id ? 'border-blue-500 scale-110' : 'border-transparent'}`} style={{background: t.id==='DAY'?'#f3f4f6':(t.id==='NIGHT'?'#111827':(t.id==='FOREST'?'#dcfce7':(t.id==='OCEAN'?'#0f172a':'#020617')))}} title={t.name}>
                                                        {t.icon}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 右: 進度條 */}
                        <div className={`w-2/3 flex flex-col relative ${themeStyle.bg} items-center justify-center p-4 group/main`}>
                            <div className="absolute top-0 w-full flex justify-center z-30 pointer-events-none">
                                <div className="relative group/timer pointer-events-auto">
                                    <div className={`px-3 py-1 rounded-b-lg shadow-sm cursor-pointer transition-colors flex items-center justify-center gap-1 border border-t-0 ${themeStyle.cardBg} ${themeStyle.border} ${themeStyle.subText}`}><span>⏱️ 延長</span></div>
                                    <div className={`absolute top-full left-1/2 -translate-x-1/2 mt-1 opacity-0 group-hover/timer:opacity-100 scale-95 group-hover/timer:scale-100 transition-all duration-200 backdrop-blur border shadow-xl rounded-xl p-2 flex gap-2 items-center min-w-max origin-top invisible group-hover/timer:visible z-40 ${themeStyle.cardBg} ${themeStyle.border}`}>
                                        <button onClick={() => handleExtension(5)} className={`font-bold py-1.5 px-3 rounded-lg text-sm transition-colors whitespace-nowrap shadow-sm border ${themeStyle.accent}`} disabled={!currentStatus || currentStatus.type !== 'exam'}>+5分</button>
                                        <button onClick={() => handleExtension(10)} className={`font-bold py-1.5 px-3 rounded-lg text-sm transition-colors whitespace-nowrap shadow-sm border ${themeStyle.accent}`} disabled={!currentStatus || currentStatus.type !== 'exam'}>+10分</button>
                                    </div>
                                </div>
                            </div>

                            <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                                <span className={`text-[4vw] font-bold drop-shadow-sm transition-all duration-500 ${currentTrackTextColor} ${themeStyle.id==='TECH'?'tech-glow-text':''}`}>{progressInfo.text}</span>
                            </div>
                            
                            <svg className={`w-full h-full transition-all duration-500 ${techGlowClass}`} viewBox={isSimple ? "0 0 300 90" : "0 0 300 50"} preserveAspectRatio="xMidYMid meet">
                                <defs>
                                    {/* 科技風跑道遮罩 (40格) */}
                                    <mask id="tech-progress-mask">
                                        <rect 
                                            x="5" y="5" width="290" 
                                            height={isSimple ? "80" : "40"} 
                                            rx={isSimple ? "40" : "20"} 
                                            ry={isSimple ? "40" : "20"} 
                                            fill="none" 
                                            stroke="white" 
                                            strokeWidth={isSimple ? 12 : 8}
                                            /* 2.1 實線 + 0.4 空隙 = 2.5 單位。 100 / 2.5 = 40 格 */
                                            strokeDasharray="2.1 0.4" 
                                            pathLength="100"
                                            strokeLinecap="butt"
                                        />
                                    </mask>
                                </defs>

                                {/* 底層軌道 */}
                                <rect x="5" y="5" width="290" height={isSimple ? "80" : "40"} rx={isSimple ? "40" : "20"} ry={isSimple ? "40" : "20"} fill="none" stroke={themeStyle.trackBase} strokeWidth={isSimple ? 12 : 8} />
                                
                                {/* 上層進度條 (Tech Mode 透過 isFlickering 觸發閃爍) */}
                                <rect 
                                    key={themeStyle.trackStyle === 'segmented' ? currentSegments : 'smooth'}
                                    x="5" y="5" width="290" height={isSimple ? "80" : "40"} rx={isSimple ? "40" : "20"} ry={isSimple ? "40" : "20"} 
                                    fill="none" 
                                    style={{ opacity: isForceHidden ? 0 : 1 }}
                                    className={`${themeStyle.id === 'TECH' ? 'tech-snap' : 'track-transition'} ${isFlickering ? 'effect-flicker' : ''} ${currentTrackColor}`} 
                                    strokeWidth={isSimple ? 12 : 8} 
                                    /* 一般模式: [100 100] 連續線條; 科技模式: [100 100] 用 Mask 切割成 40 格 */
                                    strokeDasharray="100 100" 
                                    strokeDashoffset={trackOffset} 
                                    pathLength="100" 
                                    strokeLinecap={themeStyle.trackStyle === 'segmented' ? 'butt' : 'round'}
                                    mask={themeStyle.trackStyle === 'segmented' ? 'url(#tech-progress-mask)' : undefined}
                                />
                            </svg>
                        </div>
                    </div>

                    {/* === 下方 === */}
                    <div className={`flex-1 flex flex-row transition-all duration-500 ${isSimple ? 'h-[55vh]' : 'h-[67vh]'}`}>
                        
                        {/* === 左側面板 (考試列表) === */}
                        <div className={`flex flex-col ${themeStyle.cardBg} ${themeStyle.id === 'TECH' ? 'border-r border-cyan-900/30' : `border-r-4 ${themeStyle.border}`} overflow-hidden transition-all duration-500 ${viewMode === 2 ? 'hidden' : (viewMode === 1 ? 'w-full border-r-0' : 'w-[60%] ')}`}>
                            <div className={`flex flex-col border-b-2 ${themeStyle.id==='TECH'?'border-cyan-900/30 border-dashed':`${themeStyle.border} border-dashed`} transition-all duration-500 ${viewMode === 1 ? 'h-full border-b-0' : 'h-2/3 border-b-2'}`}>
                                {examSettings.map((setting, index) => {
                                    const isActive = currentStatus && currentStatus.type === 'exam' && currentStatus.index === index;
                                    const res = mediaResources[index] || {};
                                    const subjectFontSize = isSimple ? (setting.subject.length <= 2 ? 'text-[6vw]' : 'text-[5vw]') : (setting.subject.length <= 2 ? 'text-[4vw]' : 'text-[3vw]');
                                    const timeFontSize = isSimple ? 'text-[7vw]' : 'text-[4.5vw]';

                                    return (
                                        <div key={index} className={`flex-1 flex items-center gap-1 border-b last:border-0 px-2 transition-colors duration-300 ${themeStyle.border} ${isActive ? themeStyle.activeItem : themeStyle.cardBg}`}>
                                            <div className="w-[15%] shrink-0 flex justify-center items-center">
                                                <textarea value={setting.subject} onChange={(e) => updateSetting(index, 'subject', e.target.value)} 
                                                    className={`w-full text-center font-black border-none outline-none resize-none leading-tight overflow-hidden whitespace-pre-wrap break-words transition-all duration-500 rounded-lg py-1 ${subjectFontSize} ${isActive && themeStyle.isDark ? 'text-yellow-300 bg-black/20' : `bg-transparent ${themeStyle.text}`}`}
                                                    rows={setting.subject.length > 2 ? 2 : 1} />
                                            </div>
                                            <div className="w-[60%] shrink-0 flex items-center justify-center px-1">
                                                <div className={`flex items-center justify-center gap-0 w-full rounded-2xl px-1 py-1 border-2 shadow-sm ${themeStyle.inputBg} ${themeStyle.inputBorder}`}>
                                                    <div className="relative flex-1"><TimeDisplayInput value={setting.start} onClick={() => openKeypad(index, 'start', setting.start)} textSizeClass={timeFontSize} theme={themeStyle} activeColorClass={isActive && themeStyle.isDark ? 'text-yellow-300' : ''} /></div>
                                                    <span className={`${isSimple ? 'text-[3vw]' : 'text-[2vw]'} ${themeStyle.subText} font-bold mx-1 select-none`}>~</span>
                                                    <div className="relative flex-1"><TimeDisplayInput value={setting.end} onClick={() => openKeypad(index, 'end', setting.end)} textSizeClass={timeFontSize} theme={themeStyle} activeColorClass={isActive && themeStyle.isDark ? 'text-yellow-300' : ''} /></div>
                                                </div>
                                            </div>
                                            <div className="w-[25%] shrink-0 flex flex-col justify-center gap-1 pl-1 pr-1 h-full py-1">
                                                <div className="flex-1 flex items-center gap-1 min-h-0">
                                                    {res.av ? (
                                                        <>
                                                            <div className={`w-[20%] flex justify-center text-xl ${themeStyle.text}`}>{res.av.type==='video' ? '📺' : '🎵'}</div>
                                                            <button onClick={()=>toggleAV(index)} className={`flex-1 h-[80%] rounded-lg text-white font-bold shadow flex items-center justify-center transition-colors text-sm ${avPlayer.rowIndex===index && avPlayer.isPlaying ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-500 hover:bg-blue-600'}`}>{avPlayer.rowIndex===index && avPlayer.isPlaying ? '暫停' : '播放'}</button>
                                                            <button onClick={()=>handleDelete(index,'av')} className={`w-[15%] h-[80%] rounded font-bold flex items-center justify-center ${themeStyle.accent}`}>🗑️</button>
                                                            <audio ref={el => audioRefs.current[index] = el} src={res.av.type === 'audio' ? res.av.url : undefined} onEnded={() => setAvPlayer({ rowIndex: null, isPlaying: false })} hidden />
                                                        </>
                                                    ) : (
                                                        <label className={`w-full h-[80%] border-2 border-dashed rounded-lg flex items-center justify-center font-bold cursor-pointer transition-colors text-sm opacity-50 hover:opacity-100 ${themeStyle.border} ${themeStyle.text}`}><span>📂 聽力</span><input type="file" accept="audio/*,video/*" className="hidden" onChange={e => handleAVSelect(index, e)} /></label>
                                                    )}
                                                </div>
                                                <div className="flex-1 flex items-center gap-1 min-h-0">
                                                    {(res.gallery && res.gallery.length > 0) ? (
                                                        <>
                                                            <div className={`w-[20%] flex justify-center text-xl ${themeStyle.text}`}>🖼️</div>
                                                            <button onClick={()=>setGalleryViewer({ rowIndex: index, index: 0, isOpen: true, isEnhanced: false })} className="flex-1 h-[80%] rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-bold shadow flex items-center justify-center text-sm">檢視</button>
                                                            <label className="w-[15%] h-[80%] rounded bg-emerald-100 hover:bg-emerald-200 text-emerald-600 flex items-center justify-center cursor-pointer font-bold">+<input type="file" multiple accept="image/*" className="hidden" onChange={e => handleGallerySelect(index, e)} /></label>
                                                            <button onClick={()=>handleDelete(index,'gallery')} className={`w-[15%] h-[80%] rounded font-bold flex items-center justify-center ${themeStyle.accent}`}>🗑️</button>
                                                        </>
                                                    ) : (
                                                        <label className={`w-full h-[80%] border-2 border-dashed rounded-lg flex items-center justify-center font-bold cursor-pointer transition-colors text-sm opacity-50 hover:opacity-100 ${themeStyle.border} ${themeStyle.text}`}><span>🖼️ 圖片</span><input type="file" multiple accept="image/*" className="hidden" onChange={e => handleGallerySelect(index, e)} /></label>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className={`h-1/3 flex flex-row ${themeStyle.bg} transition-all duration-500 ${isSimple ? 'hidden' : 'flex'}`}>
                                <div className={`flex-1 flex flex-col items-center justify-center border-r p-2 ${themeStyle.border}`}>
                                    <span className={`text-[1.8vw] font-bold ${themeStyle.text} opacity-80`}>應到</span>
                                    <input type="number" value={attendance.shouldArrive} onChange={(e) => setAttendance({...attendance, shouldArrive: e.target.value})} className={`w-full text-center bg-transparent text-[4.5vw] font-bold ${themeStyle.text} outline-none`} placeholder="0" />
                                </div>
                                <div className={`flex-1 flex flex-col items-center justify-center border-r p-2 ${themeStyle.border}`}>
                                    <span className={`text-[1.8vw] font-bold ${themeStyle.text} opacity-80`}>實到</span>
                                    <input type="number" value={attendance.actualArrive} onChange={(e) => setAttendance({...attendance, actualArrive: e.target.value})} className={`w-full text-center bg-transparent text-[4.5vw] font-bold ${themeStyle.text} outline-none`} placeholder="0" />
                                </div>
                                <div className="flex-[1.5] flex flex-col items-center justify-center p-2">
                                    <span className={`text-[1.8vw] font-bold ${themeStyle.text} opacity-80`}>未到座號</span>
                                    <textarea value={attendance.absentList} onChange={(e) => setAttendance({...attendance, absentList: e.target.value})} className={`w-full h-full text-center bg-transparent text-[2.5vw] font-bold text-red-500 outline-none resize-none pt-2 leading-tight`} placeholder="輸入" />
                                </div>
                            </div>
                        </div>

                        {/* === 右側提醒 === */}
                        <div className={`${themeStyle.reminderBg} flex flex-col relative overflow-hidden transition-all duration-500 ${viewMode === 1 ? 'hidden' : (viewMode === 2 ? 'w-full border-l-0' : 'w-[40%]')} ${themeStyle.id==='TECH'?'border-l':''}`}>
                            <div className="absolute top-0 left-0 z-20 flex items-center">
                                <div className={`${themeStyle.reminderLabel} px-4 py-2 text-xl font-bold rounded-br-lg shadow-md`}>提醒事項</div>
                            </div>
                            <div className="flex-1 flex items-center justify-center p-8">
                                <div className={`${viewMode === 2 ? 'text-[6vw]' : 'text-[4vw]'} font-bold text-center leading-snug animate-fade-in ${themeStyle.reminderText}`} key={reminderText} style={{whiteSpace: 'pre-line'}}>
                                    {reminderText}
                                </div>
                            </div>
                            <div className="h-4 w-full" style={themeStyle.id === 'TECH' ? {background: 'repeating-linear-gradient(45deg, #0891b2 0, #0891b2 2px, transparent 2px, transparent 8px)'} : {backgroundImage: 'linear-gradient(45deg, #fbbf24 25%, transparent 25%, transparent 50%, #fbbf24 50%, #fbbf24 75%, transparent 75%, transparent)', backgroundSize: '20px 20px'}}></div>
                        </div>
                    </div>

                    {/* === Overlays (Av/Gallery) === */}
                    {(avPlayer.isPlaying && avPlayer.rowIndex !== null && mediaResources[avPlayer.rowIndex]?.av?.type === 'video') && (
                        <div className="fixed inset-0 bg-black z-[60] flex items-center justify-center">
                            <video ref={videoRef} src={mediaResources[avPlayer.rowIndex].av.url} autoPlay controls className="max-w-full max-h-full w-full h-full shadow-2xl" onEnded={() => setAvPlayer({ rowIndex: null, isPlaying: false })} />
                            <button onClick={() => setAvPlayer({ rowIndex: null, isPlaying: false })} className="absolute top-6 right-6 text-white bg-red-600/80 hover:bg-red-600 rounded-full w-14 h-14 text-3xl font-bold shadow-lg z-[70]">×</button>
                        </div>
                    )}
                    {(galleryViewer.isOpen && galleryViewer.rowIndex !== null) && (
                        <div className="fixed inset-0 bg-black/95 z-[60] flex flex-col select-none" onTouchStart={e => touchStartRef.current = e.touches[0].clientX} onTouchMove={handleTouchMove} onTouchEnd={() => touchStartRef.current = null}>
                            <div className="h-16 flex justify-between items-center px-6 bg-gradient-to-b from-black/60 to-transparent absolute top-0 w-full z-10">
                                <span className="text-white font-bold text-xl drop-shadow-md">{mediaResources[galleryViewer.rowIndex]?.gallery[galleryViewer.index]?.name} ({galleryViewer.index + 1} / {mediaResources[galleryViewer.rowIndex]?.gallery.length})</span>
                                <button onClick={() => setGalleryViewer(p => ({ ...p, isOpen: false }))} className="bg-red-600 hover:bg-red-700 text-white w-10 h-10 rounded-full font-bold shadow-lg flex items-center justify-center text-xl">×</button>
                            </div>
                            <div className="flex-1 relative flex items-center justify-center overflow-hidden p-2">
                                {mediaResources[galleryViewer.rowIndex]?.gallery[galleryViewer.index] && (
                                    <img src={mediaResources[galleryViewer.rowIndex].gallery[galleryViewer.index].url} className={`img-contain transition-all duration-300 ${galleryViewer.isEnhanced ? 'magic-filter' : ''}`} alt="gallery" />
                                )}
                                <button className="absolute left-2 top-1/2 -translate-y-1/2 w-20 h-40 flex items-center justify-center text-white/30 hover:text-white hover:bg-white/10 rounded-xl transition text-5xl font-bold disabled:opacity-0" disabled={galleryViewer.index === 0} onClick={() => setGalleryViewer(p => ({ ...p, index: p.index - 1 }))}>❮</button>
                                <button className="absolute right-2 top-1/2 -translate-y-1/2 w-20 h-40 flex items-center justify-center text-white/30 hover:text-white hover:bg-white/10 rounded-xl transition text-5xl font-bold disabled:opacity-0" disabled={galleryViewer.index === (mediaResources[galleryViewer.rowIndex]?.gallery.length - 1)} onClick={() => setGalleryViewer(p => ({ ...p, index: p.index + 1 }))}>❯</button>
                            </div>
                             <div className="h-24 bg-gray-900/80 backdrop-blur flex items-center justify-center gap-6 pb-4">
                                <button onClick={() => setGalleryViewer(p => ({ ...p, isEnhanced: !p.isEnhanced }))} className={`px-8 py-3 rounded-full font-bold text-xl flex items-center gap-3 transition-all active:scale-95 shadow-lg border-2 ${galleryViewer.isEnhanced ? 'bg-yellow-500 text-black border-yellow-400 shadow-yellow-500/30' : 'bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600'}`}>{galleryViewer.isEnhanced ? '↩️ 還原原圖' : '🪄 一鍵美化'}</button>
                                <button onClick={() => setGalleryViewer(p => ({ ...p, isOpen: false }))} className="px-8 py-3 rounded-full font-bold text-xl flex items-center gap-3 transition-all active:scale-95 shadow-lg border-2 bg-red-600 text-white border-red-500 hover:bg-red-700 shadow-red-900/30">🚪 關閉瀏覽</button>
                            </div>
                        </div>
                    )}
                    
                    <TimeKeypadModal isOpen={keypadState.isOpen} onClose={() => setKeypadState(p => ({ ...p, isOpen: false }))} initialTime={keypadState.initialTime} onConfirm={onKeypadConfirm} theme={themeStyle} />
                    <SettingsModal isOpen={isSettingsOpen} onClose={()=>setIsSettingsOpen(false)} messages={messageSettings} onSave={setMessageSettings} theme={themeStyle} />
                    <style>{`@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }`}</style>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
