<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動態分組小工具</title>

  <!-- 沿用既有依賴，不新增第三方套件 -->
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e',950:'#082f49' }
          },
          keyframes: {
            fadeIn: { '0%': { opacity:'0', transform:'translateY(8px)' }, '100%': { opacity:'1', transform:'translateY(0)' } },
            popIn: { '0%': { opacity:'0', transform:'scale(.96)' }, '100%': { opacity:'1', transform:'scale(1)' } }
          },
          animation: {
            'fade-in': 'fadeIn .25s ease-out both',
            'pop-in': 'popIn .25s ease-out both'
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script>globalThis.XLSXWriter = globalThis.XLSX;</script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    globalThis.XLSXReader = globalThis.XLSX;
    globalThis.XLSX = globalThis.XLSXReader;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root { color-scheme: light; }
    .dark { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      overflow-x: hidden;
    }
    button, input, select { font: inherit; }
    button { touch-action: manipulation; }

    .bg-ocean-gradient { background: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #f0f9ff 42%, #ffffff 100%); }
    .dark .bg-ocean-gradient { background: radial-gradient(circle at 50% 0%, #075985 0%, #0c4a6e 42%, #082f49 100%); }

    .acrylic-card {
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: 0 12px 36px -18px rgba(15,23,42,.25), inset 0 1px 0 rgba(255,255,255,.85);
    }
    .dark .acrylic-card {
      background: rgba(15,23,42,.72);
      border-color: rgba(255,255,255,.1);
      box-shadow: 0 12px 36px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    }

    .view-section { display: none; }
    .view-section.active { display: flex; }

    .seat-chip {
      min-height: 58px;
      transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, border-color .15s ease;
      user-select: none;
    }
    .seat-chip:active { transform: scale(.96); }
    .chip-boy { background: linear-gradient(135deg,#e0f2fe,#bae6fd); color:#0369a1; border:2px solid #7dd3fc; }
    .chip-girl { background: linear-gradient(135deg,#fce7f3,#fbcfe8); color:#be185d; border:2px solid #f9a8d4; }
    .chip-absent { background:#f1f5f9; color:#94a3b8; border:2px dashed #cbd5e1; text-decoration: line-through; opacity:.68; filter:grayscale(.8); }
    .chip-excluded { opacity:.45; filter:grayscale(.6); box-shadow: inset 0 0 0 3px #f59e0b; }
    .dark .chip-boy { background:rgba(2,132,199,.22); color:#7dd3fc; border-color:rgba(56,189,248,.5); }
    .dark .chip-girl { background:rgba(219,39,119,.22); color:#f9a8d4; border-color:rgba(244,114,182,.45); }
    .dark .chip-absent { background:rgba(71,85,105,.3); color:#64748b; border-color:#475569; }

    /* 結果頁夜間模式：結果需要遠距離辨識，改用較實心的男女座號色塊。
       僅限結果頁，不影響點名頁與逐組會場的互動座號樣式。 */
    .dark #view-result .chip-boy {
      background: linear-gradient(135deg,#075985,#0c4a6e);
      color:#e0f2fe;
      border-color:#38bdf8;
      box-shadow: inset 0 0 0 1px rgba(186,230,253,.12), 0 2px 8px rgba(2,132,199,.18);
    }
    .dark #view-result .chip-girl {
      background: linear-gradient(135deg,#831843,#9d174d);
      color:#fce7f3;
      border-color:#f472b6;
      box-shadow: inset 0 0 0 1px rgba(251,207,232,.12), 0 2px 8px rgba(219,39,119,.16);
    }

    .big-input, .big-select {
      min-height: 50px;
      font-size: 1.08rem;
      font-weight: 800;
    }
    .big-select { padding-right: 2.5rem; }

    .soft-disabled { opacity:.48; filter:grayscale(.25); }
    .soft-disabled button, .soft-disabled input, .soft-disabled select { cursor:not-allowed; }

    .advanced-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .25s ease, opacity .2s ease;
    }
    .advanced-panel > div { overflow: hidden; }
    .advanced-panel.open { grid-template-rows: 1fr; opacity: 1; }

    .group-card { min-height: 180px; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:999px; }
    .dark ::-webkit-scrollbar-thumb { background:#475569; }


    /* 快速分組：同一套版面依瀏覽器實際可用高度自動收斂，不判斷 Edge / Chrome。 */
    main { min-height: 100dvh; }
    .quick-group-view { gap: 1rem; }
    .quick-group-toolbar h2 { line-height: 1.05; }
    .quick-settings-card { padding: 1.1rem 1.2rem; }
    .quick-settings-grid { gap: 1rem; }
    .quick-mode-block, .quick-scale-block { padding: 1rem 1.1rem; }
    .quick-mode-block .big-select { min-height: 54px; font-size: 1.12rem; }
    .quick-scale-block .big-input { min-height: 48px; }
    .quick-scale-block label { padding-top: .6rem !important; padding-bottom: .6rem !important; }
    .quick-scale-block #scale-mixed { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .quick-scale-block #scale-mixed.hidden { display: none; }
    .quick-scale-block #scale-mixed > label { margin-top: 0 !important; }
    .quick-scale-block #scale-separate { row-gap: .65rem; }
    .quick-scale-block #separate-groups-options,
    .quick-scale-block #separate-persons-options { row-gap: .5rem; }
    #calc-preview { margin-top: .75rem !important; padding: .75rem .9rem !important; }
    .preview-total { display:flex; align-items:baseline; gap:.35rem; margin-bottom:.55rem; }
    .preview-total > span { font-size:1.28rem; }
    .gender-preview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.55rem; }
    .gender-preview-block {
      min-width:0; padding:.65rem .8rem; border-radius:.8rem; display:flex; align-items:center; justify-content:space-between; gap:.75rem;
      background:rgba(255,255,255,.72); border:1px solid rgba(14,165,233,.2);
    }
    .dark .gender-preview-block { background:rgba(15,23,42,.5); border-color:rgba(56,189,248,.25); }
    .gender-preview-label { font-weight:900; white-space:nowrap; }
    .gender-preview-sizes { font-weight:900; text-align:right; overflow-wrap:anywhere; }
    .gender-preview-girl { border-color:rgba(244,114,182,.28); }
    .dark .gender-preview-girl { border-color:rgba(244,114,182,.3); }
    .start-group-card { margin-top: .9rem !important; padding: .9rem 1rem !important; }
    .start-group-card h3 { margin-bottom:.7rem !important; }
    .start-group-card #btn-instant, .start-group-card #btn-stepwise { min-height:58px; }

    /* 一般瀏覽器在 1366×768 等環境常只剩約 620～740px 網頁高度：只壓縮間距，不把字縮小。 */
    @media (max-height: 759px) {
      main { padding-top:.7rem !important; padding-bottom:.7rem !important; }
      .quick-group-view { gap:.65rem; }
      .quick-group-toolbar h2 { font-size:1.85rem !important; }
      #group-count-summary { margin-top:.15rem !important; line-height:1.25; }
      .quick-group-toolbar .px-5 { padding-left:.9rem !important; padding-right:.9rem !important; }
      .quick-group-toolbar .py-3 { padding-top:.6rem !important; padding-bottom:.6rem !important; }
      .quick-settings-card { padding:.75rem .85rem !important; }
      .quick-settings-grid { gap:.65rem; }
      .quick-mode-block, .quick-scale-block { padding:.7rem .8rem !important; }
      .quick-mode-block label, .quick-scale-block h3 { margin-bottom:.45rem !important; }
      .quick-mode-block #mode-hint { margin-top:.35rem !important; line-height:1.2; }
      .quick-mode-block .big-select { min-height:46px; }
      .quick-scale-block .big-input { min-height:44px; }
      .quick-scale-block label { padding-top:.42rem !important; padding-bottom:.42rem !important; }
      .quick-scale-block #scale-separate { row-gap:.4rem; }
      .quick-scale-block #separate-groups-options,
      .quick-scale-block #separate-persons-options { row-gap:.3rem; }
      #calc-preview { margin-top:.5rem !important; padding:.55rem .7rem !important; line-height:1.25; }
      .preview-total { margin-bottom:.35rem; }
      .gender-preview-block { padding:.45rem .65rem; }
      #advanced-panel { margin-top:.55rem !important; }
      #advanced-panel .rounded-2xl { padding:.7rem .8rem !important; }
      .start-group-card { margin-top:.55rem !important; padding:.65rem .8rem !important; }
      .start-group-card h3 { margin-bottom:.45rem !important; }
      .start-group-card #btn-instant, .start-group-card #btn-stepwise { min-height:52px; }
    }

    /* 極低視窗不再硬壓；維持可讀字級，讓頁面自然出現捲軸。 */
    @media (max-height: 619px) {
      .quick-group-view { min-height:auto; }
    }

    @media (max-width: 767px) {
      .quick-scale-block #scale-mixed { grid-template-columns:1fr; }
      .gender-preview-grid { grid-template-columns:1fr; }
      .gender-preview-block { align-items:flex-start; }
    }
  </style>
</head>
<body class="bg-ocean-gradient text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- 資料使用提醒：獨立於主程式初始化，不改動既有功能流程 -->
    <style>
        .teacher-tools-privacy-overlay {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .teacher-tools-privacy-card {
            width: min(520px, calc(100vw - 40px));
            box-sizing: border-box;
            padding: 26px 28px 24px;
            border: 1px solid #d7e5dc;
            border-radius: 18px;
            background: #fffdf8;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
            color: #334155;
            font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
        }
        .teacher-tools-privacy-title {
            margin: 0 0 18px;
            color: #334155;
            font-size: 1.45rem;
            font-weight: 900;
            text-align: center;
        }
        .teacher-tools-privacy-item {
            margin: 13px 0;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.8;
        }
        .teacher-tools-privacy-no-upload {
            color: #b42318;
            font-size: 1.22em;
            font-weight: 900;
        }
        .teacher-tools-privacy-local {
            color: #18794e;
            font-size: 1.22em;
            font-weight: 900;
        }
        .teacher-tools-privacy-confirm {
            display: block;
            width: 100%;
            margin: 22px 0 0;
            padding: 12px 18px;
            border: 0;
            border-radius: 12px;
            background: #b7791f;
            color: #fff;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }
        .teacher-tools-privacy-confirm:hover { background: #956117; }
        .teacher-tools-privacy-confirm:focus-visible {
            outline: 3px solid #f6c453;
            outline-offset: 3px;
        }
    </style>
    <div id="teacher-tools-privacy-overlay" class="teacher-tools-privacy-overlay"
         role="dialog" aria-modal="true" aria-labelledby="teacher-tools-privacy-title">
        <div class="teacher-tools-privacy-card">
            <h2 id="teacher-tools-privacy-title" class="teacher-tools-privacy-title">🔒 資料使用提醒</h2>
            <p class="teacher-tools-privacy-item">
                ◆ 學生名單與使用者輸入資料
                <strong class="teacher-tools-privacy-no-upload">「不會上傳網站」</strong>。
            </p>
            <p class="teacher-tools-privacy-item">
                ◆ 資料處理和記憶均在
                <strong class="teacher-tools-privacy-local">「本地電腦完成」</strong>。
            </p>
            <button id="teacher-tools-privacy-confirm" class="teacher-tools-privacy-confirm" type="button">我知道了</button>
        </div>
    </div>
    <script>
        (() => {
            const PRIVACY_NOTICE_SESSION_KEY = "teacher_tools_group_privacy_notice_session_v1";
            const overlay = document.getElementById("teacher-tools-privacy-overlay");
            const confirmButton = document.getElementById("teacher-tools-privacy-confirm");

            let alreadyConfirmed = false;
            try {
                alreadyConfirmed = sessionStorage.getItem(PRIVACY_NOTICE_SESSION_KEY) === "yes";
            } catch (_) {
                // sessionStorage 不可用時，本次仍顯示提醒；不影響主程式後續功能。
            }

            if (alreadyConfirmed) {
                overlay?.remove();
                return;
            }

            confirmButton?.addEventListener("click", () => {
                try {
                    sessionStorage.setItem(PRIVACY_NOTICE_SESSION_KEY, "yes");
                } catch (_) {
                    // 無法記憶時只代表下次會再提醒，不阻斷主程式。
                }
                overlay?.remove();
            }, { once: true });

            requestAnimationFrame(() => confirmButton?.focus());
        })();
    </script>

  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[10000] flex flex-col gap-2 w-[min(92vw,520px)] pointer-events-none"></div>

  <main class="max-w-6xl mx-auto w-full p-4 md:p-6">
    <!-- 1. 名單 / 缺席設定 -->
    <section id="view-roster" class="view-section flex-col gap-5 animate-fade-in">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-3xl font-black text-ocean-900 dark:text-white">名單與缺席</h2>
          <p id="roster-helper" class="text-base md:text-lg font-semibold text-slate-500 dark:text-slate-400 mt-1"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="btn-roster-cancel" type="button" onclick="cancelRosterEdit()" class="hidden px-5 py-3 rounded-xl font-black bg-white/80 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-ocean-400">← 返回快速分組</button>
          <button id="btn-clear-roster" type="button" onclick="clearRosterMemory()" class="hidden px-5 py-3 rounded-xl font-black bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-300 border border-rose-200 dark:border-rose-900 hover:bg-rose-100 dark:hover:bg-rose-950/50">清空名單記憶</button>
          <button type="button" onclick="toggleTheme()" class="theme-toggle w-11 h-11 rounded-full flex-shrink-0 flex items-center justify-center bg-white/80 hover:bg-white dark:bg-slate-800/80 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 shadow-sm" title="切換深淺色"><span class="theme-icon text-xl">🌙</span></button>
        </div>
      </div>

      <div class="acrylic-card rounded-3xl p-5 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="rounded-2xl border border-ocean-200 dark:border-ocean-800 bg-white/55 dark:bg-slate-900/35 p-5">
            <h3 class="text-xl font-black mb-2">快速產生座號</h3>
            <p class="text-sm md:text-base font-semibold text-slate-500 dark:text-slate-400 mb-4">輸入班級人數，先建立完整座號，再調整性別與本次缺席。</p>
            <div class="flex gap-3">
              <input id="quick-count" type="number" min="2" max="100" value="28" class="big-input w-28 px-3 text-center rounded-xl bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 focus:border-ocean-500 outline-none">
              <button type="button" onclick="generateRosterDraft()" class="flex-1 min-h-[50px] rounded-xl font-black text-white bg-ocean-500 hover:bg-ocean-600 shadow-lg shadow-ocean-500/20">產生名單</button>
            </div>
          </div>

          <div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white/55 dark:bg-slate-900/35 p-5">
            <div class="flex items-center justify-between gap-3 mb-2">
              <h3 class="text-xl font-black">匯入 Excel</h3>
              <button type="button" onclick="downloadExcelTemplate()" class="px-3 py-2 rounded-lg text-sm font-black text-ocean-700 dark:text-ocean-300 bg-ocean-50 dark:bg-ocean-950/40 border border-ocean-200 dark:border-ocean-800">下載範本</button>
            </div>
            <p class="text-sm md:text-base font-semibold text-slate-500 dark:text-slate-400 mb-4">讀取「座號、性別」後仍會進入本頁確認。</p>
            <input id="excel-upload" type="file" accept=".xlsx" onchange="handleExcelUpload(event)" class="block w-full text-base font-semibold text-slate-500 file:mr-3 file:px-4 file:py-3 file:rounded-xl file:border-0 file:font-black file:bg-ocean-100 file:text-ocean-700 hover:file:bg-ocean-200 dark:file:bg-ocean-950/50 dark:file:text-ocean-200 cursor-pointer">
          </div>
        </div>
      </div>

      <div id="roster-editor-card" class="acrylic-card rounded-3xl p-5 md:p-6 hidden">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
          <div>
            <h3 class="text-2xl font-black">座號設定</h3>
            <p class="text-base font-semibold text-slate-500 dark:text-slate-400 mt-1">單擊：切換本次缺席｜雙擊或右鍵：切換男女</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" onclick="swapAllDraftGenders()" class="px-4 py-3 rounded-xl font-black bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:border-ocean-400">男女互換</button>
            <button type="button" onclick="saveRosterDraft()" class="px-6 py-3 rounded-xl font-black text-white bg-ocean-500 hover:bg-ocean-600 shadow-lg shadow-ocean-500/20">完成儲存</button>
          </div>
        </div>
        <div id="roster-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 xl:grid-cols-12 gap-3"></div>
      </div>
    </section>

    <!-- 2. 快速分組 -->
    <section id="view-group" class="view-section quick-group-view flex-col gap-5 animate-fade-in">
      <div class="quick-group-toolbar flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-3xl font-black text-ocean-900 dark:text-white">快速分組</h2>
          <p id="group-count-summary" class="text-base md:text-lg font-bold text-slate-500 dark:text-slate-400 mt-1"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button type="button" onclick="openRosterEditor()" class="px-5 py-3 rounded-xl font-black bg-white/85 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-ocean-400">修改名單 / 點名</button>
          <button id="btn-toggle-advanced" type="button" onclick="toggleAdvanced()" class="px-5 py-3 rounded-xl font-black text-ocean-700 dark:text-ocean-200 bg-ocean-100/90 dark:bg-ocean-950/45 border border-ocean-200 dark:border-ocean-800 hover:bg-ocean-200 dark:hover:bg-ocean-900/60">⚙ 進階條件</button>
          <button type="button" onclick="toggleTheme()" class="theme-toggle w-11 h-11 rounded-full flex-shrink-0 flex items-center justify-center bg-white/80 hover:bg-white dark:bg-slate-800/80 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 shadow-sm" title="切換深淺色">
            <span class="theme-icon text-xl">🌙</span>
          </button>
        </div>
      </div>

      <div class="acrylic-card quick-settings-card rounded-3xl p-5 md:p-7">
        <div class="quick-settings-grid grid grid-cols-1 lg:grid-cols-[0.9fr_1.6fr] gap-5">
          <div class="quick-mode-block rounded-2xl bg-white/55 dark:bg-slate-900/35 border border-slate-200 dark:border-slate-700 p-5">
            <label for="group-mode" class="block text-xl font-black mb-3">分組模式</label>
            <select id="group-mode" onchange="onGroupSettingChanged()" class="big-select w-full px-4 rounded-xl bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 focus:border-ocean-500 outline-none">
              <option value="balanced">男女盡量平均</option>
              <option value="random">完全隨機</option>
              <option value="separate">男女分開</option>
            </select>
            <p id="mode-hint" class="text-sm md:text-base font-semibold text-slate-500 dark:text-slate-400 mt-3"></p>
          </div>

          <div class="quick-scale-block rounded-2xl bg-white/55 dark:bg-slate-900/35 border border-slate-200 dark:border-slate-700 p-5">
            <h3 class="text-xl font-black mb-4">分組規模</h3>

            <div id="scale-mixed" class="space-y-3">
              <label class="flex items-center gap-3 p-3 rounded-xl border-2 border-transparent hover:border-ocean-200 cursor-pointer">

          <h2 class="text-3xl font-black text-ocean-900 dark:text-white">分組結果</h2>
          <p id="result-summary" class="text-base md:text-lg font-bold text-slate-500 dark:text-slate-400 mt-1"></p>
        </div>

          <button type="button" onclick="exportGroups()" class="px-5 py-3 rounded-xl font-black text-white bg-emerald-500 hover:bg-emerald-400 shadow-lg shadow-emerald-500/20">下載 Excel</button>

        </div>

  <script>
    'use strict';

    const ROSTER_KEY = 'OceanGroupMakerRosterV2';
    const LEGACY_KEY = 'OceanGroupMakerData';
    const SESSION_KEY = 'OceanGroupMakerSessionV2';

    const DEFAULT_SESSION = {
      absentSeats: [],
      groupMode: 'balanced',
      scaleMode: 'by_groups',
      groups: 5,
      persons: 4,
      separateScaleMode: 'groups',
      separateGroupsPlan: 'auto',
      separateTotalGroups: 6,
      boysGroups: 3,
      girlsGroups: 3,
      separatePersonsPlan: 'common',
      separateCommonPersons: 4,
      boysPersons: 4,
      girlsPersons: 4,
      advancedOpen: false,
      isolationGroups: ['']
    };

    let roster = [];
    let rosterDraft = [];
    let draftAbsentSeats = new Set();
    let sessionState = structuredClone(DEFAULT_SESSION);
    let runtimeDirty = false;
    let lastPlan = null;
    let finalResults = [];
    let arenaState = null;

    document.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
      loadRoster();
      loadSessionState();
      bindRefreshProtection();
      syncGroupControlsFromState();

      if (roster.length > 0) {
        showView('group');
      } else {
        openRosterEditor(true);
      }
    }

    function bindRefreshProtection() {
      window.addEventListener('beforeunload', (event) => {
        if (!runtimeDirty) return;
        event.preventDefault();
        event.returnValue = '';
      });
      window.addEventListener('pagehide', () => {
        if (runtimeDirty) sessionStorage.removeItem(SESSION_KEY);
      });
    }

    function markRuntimeDirty() {
      runtimeDirty = true;
    }

    function loadRoster() {
      try {
        const raw = localStorage.getItem(ROSTER_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          roster = sanitizeRoster(Array.isArray(data) ? data : data.roster);
          return;
        }

        const legacyRaw = localStorage.getItem(LEGACY_KEY);
        if (legacyRaw) {
          const legacy = JSON.parse(legacyRaw);
          roster = sanitizeRoster(legacy.roster || []);
          if (roster.length > 0) {
            persistRoster();
            localStorage.removeItem(LEGACY_KEY);
          }
        }
      } catch (error) {
        console.error('Roster load failed:', error);
        roster = [];
      }
    }

    function sanitizeRoster(items) {
      if (!Array.isArray(items)) return [];
      const seen = new Set();
      return items.map((item) => {
        const seat = String(item?.seat ?? '').trim();
        const gender = item?.gender === 'G' ? 'G' : 'B';
        return { seat, gender };
      }).filter((item) => {
        if (!item.seat || seen.has(item.seat)) return false;
        seen.add(item.seat);
        return true;
      }).sort(compareSeats);
    }

    function compareSeats(a, b) {
      const an = Number(a.seat ?? a);
      const bn = Number(b.seat ?? b);
      if (Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
      return String(a.seat ?? a).localeCompare(String(b.seat ?? b), 'zh-Hant');
    }

    function persistRoster() {
      localStorage.setItem(ROSTER_KEY, JSON.stringify({ roster }));
    }

    function loadSessionState() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        sessionState = { ...structuredClone(DEFAULT_SESSION), ...parsed };
        if (!Array.isArray(sessionState.absentSeats)) sessionState.absentSeats = [];
        if (!Array.isArray(sessionState.isolationGroups) || sessionState.isolationGroups.length === 0) sessionState.isolationGroups = [''];
        const rosterSeats = new Set(roster.map(r => r.seat));
        sessionState.absentSeats = sessionState.absentSeats.filter(seat => rosterSeats.has(String(seat))).map(String);
      } catch (error) {
        console.error('Session state load failed:', error);
        sessionState = structuredClone(DEFAULT_SESSION);
      }
    }

    function saveSessionState() {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionState));
      markRuntimeDirty();
    }

    function clearSessionRuntime() {
      sessionStorage.removeItem(SESSION_KEY);
      sessionState = structuredClone(DEFAULT_SESSION);
      runtimeDirty = false;
      finalResults = [];
      arenaState = null;
      lastPlan = null;
    }

    function showView(name) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${name}`).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'auto' });

      if (name === 'group') renderGroupPage();
      if (name === 'arena') renderArena();
      if (name === 'result') renderResultPage();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const icon = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
      document.querySelectorAll('.theme-icon').forEach(el => { el.textContent = icon; });
    }

    // ---------- 名單 / 缺席 ----------
    function openRosterEditor(firstTime = false) {
      rosterDraft = roster.map(item => ({ ...item }));
      draftAbsentSeats = new Set(sessionState.absentSeats.map(String));
      document.getElementById('btn-roster-cancel').classList.toggle('hidden', firstTime || roster.length === 0);
      document.getElementById('btn-clear-roster').classList.toggle('hidden', roster.length === 0);
      document.getElementById('roster-helper').textContent = roster.length === 0
        ? '同一台電腦只要設定一次完整名單，之後開啟會直接進入快速分組。'
        : '完整名單會保留；缺席只套用本次操作，重新整理後清除。';
      renderRosterDraft();
      showView('roster');
    }

    function cancelRosterEdit() {
      if (roster.length === 0) return;
      rosterDraft = [];
      draftAbsentSeats = new Set();
      showView('group');
    }

    function generateRosterDraft() {
      const count = Number(document.getElementById('quick-count').value);
      if (!Number.isInteger(count) || count < 2 || count > 100) {
        showToast('請輸入 2～100 人。', 'error');
        return;
      }
      const half = Math.ceil(count / 2);
      rosterDraft = Array.from({ length: count }, (_, index) => ({
        seat: String(index + 1),
        gender: index < half ? 'B' : 'G'
      }));
      draftAbsentSeats = new Set();
      renderRosterDraft();
      showToast('名單已建立，請確認性別與本次缺席。', 'success');
    }

    function renderRosterDraft() {
      const card = document.getElementById('roster-editor-card');
      const grid = document.getElementById('roster-grid');
      grid.innerHTML = '';
      card.classList.toggle('hidden', rosterDraft.length === 0);
      if (rosterDraft.length === 0) return;

      rosterDraft.forEach(item => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = `seat-chip rounded-2xl font-black text-lg border flex flex-col items-center justify-center ${draftAbsentSeats.has(item.seat) ? 'chip-absent' : item.gender === 'B' ? 'chip-boy' : 'chip-girl'}`;
        chip.innerHTML = `<span class="text-sm opacity-80">${item.gender === 'B' ? '👦' : '👧'}</span><span>${escapeHtml(item.seat)}</span>`;
        chip.addEventListener('click', () => {
          if (draftAbsentSeats.has(item.seat)) draftAbsentSeats.delete(item.seat);
          else draftAbsentSeats.add(item.seat);
          renderRosterDraft();
        });
        const flip = (event) => {
          event.preventDefault();
          item.gender = item.gender === 'B' ? 'G' : 'B';
          renderRosterDraft();
        };
        chip.addEventListener('dblclick', flip);
        chip.addEventListener('contextmenu', flip);
        grid.appendChild(chip);
      });
    }

    function swapAllDraftGenders() {
      rosterDraft.forEach(item => item.gender = item.gender === 'B' ? 'G' : 'B');
      renderRosterDraft();
    }

    function saveRosterDraft() {
      if (rosterDraft.length < 2) {
        showToast('請先建立至少 2 人的名單。', 'error');
        return;
      }
      roster = sanitizeRoster(rosterDraft);
      persistRoster();
      const validSeats = new Set(roster.map(r => r.seat));
      sessionState.absentSeats = [...draftAbsentSeats].filter(seat => validSeats.has(seat));
      sessionState.isolationGroups = sessionState.isolationGroups.map(text => filterIsolationTextToRoster(text));
      saveSessionState();
      showToast('名單已儲存。', 'success');
      showView('group');
    }

    function filterIsolationTextToRoster(text) {
      const rosterSeats = new Set(roster.map(r => r.seat));
      return parseSeatText(text).filter(seat => rosterSeats.has(seat)).join(',');
    }

    function clearRosterMemory() {
      if (!confirm('確定要清空完整名單記憶嗎？\n清空後需重新建立或匯入名單。')) return;
      localStorage.removeItem(ROSTER_KEY);
      localStorage.removeItem(LEGACY_KEY);
      clearSessionRuntime();
      roster = [];
      rosterDraft = [];
      draftAbsentSeats = new Set();
      document.getElementById('btn-roster-cancel').classList.add('hidden');
      document.getElementById('btn-clear-roster').classList.add('hidden');
      document.getElementById('roster-helper').textContent = '同一台電腦只要設定一次完整名單，之後開啟會直接進入快速分組。';
      renderRosterDraft();
      showToast('名單記憶已清空。', 'success');
    }

    function downloadExcelTemplate() {
      if (typeof XLSXWriter === 'undefined') {
        showToast('Excel 元件尚未載入。', 'error');
        return;
      }
      const ws = XLSXWriter.utils.json_to_sheet([
        { '座號': 1, '性別': '男' },
        { '座號': 2, '性別': '女' },
        { '座號': 3, '性別': '男' }
      ]);
      const wb = XLSXWriter.utils.book_new();
      XLSXWriter.utils.book_append_sheet(wb, ws, '名單設定');
      XLSXWriter.writeFile(wb, '動態分組名單範本.xlsx');
    }

    function handleExcelUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.xlsx')) {
        showToast('僅支援 Excel 檔案（.xlsx）。', 'error');
        event.target.value = '';
        return;
      }
      if (typeof XLSXReader === 'undefined') {
        showToast('Excel 元件尚未載入。', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = (loadEvent) => {
        try {
          const workbook = XLSXReader.read(new Uint8Array(loadEvent.target.result), { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSXReader.utils.sheet_to_json(worksheet, { defval: '' });
          const imported = [];
          rows.forEach(row => {
            const seat = String(row['座號'] || row['號碼'] || Object.values(row)[0] || '').trim();
            if (!seat) return;
            const rawGender = String(row['性別'] || '').trim().toLowerCase();
            const gender = rawGender.includes('女') || rawGender === 'f' || rawGender === 'girl' ? 'G' : 'B';
            imported.push({ seat, gender });
          });
          rosterDraft = sanitizeRoster(imported);
          draftAbsentSeats = new Set();
          if (rosterDraft.length < 2) throw new Error('No usable roster');
          renderRosterDraft();
          showToast(`已讀取 ${rosterDraft.length} 筆，請確認後儲存。`, 'success');
        } catch (error) {
          console.error(error);
          showToast('無法讀取名單，請確認 Excel 欄位。', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function parseSeatText(text) {
      return String(text || '')
        .replace(/，/g, ',')
        .split(/[\s,]+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function parseIsolationGroups() {
      const rosterSeats = new Set(roster.map(r => r.seat));
      const seenAcross = new Map();
      const groups = [];
      const errors = [];
      let configured = false;

      sessionState.isolationGroups.forEach((raw, index) => {
        const tokens = parseSeatText(raw);
        if (tokens.length === 0) return;
        configured = true;
        const unique = [];
        const localSeen = new Set();
        for (const seat of tokens) {
          if (!rosterSeats.has(seat)) {
            errors.push(`條件 ${index + 1}：找不到 ${seat} 號`);
            continue;
          }
          if (localSeen.has(seat)) {
            errors.push(`條件 ${index + 1}：${seat} 號重複`);
            continue;
          }
          localSeen.add(seat);
          if (seenAcross.has(seat)) {
            errors.push(`${seat} 號已存在於條件 ${seenAcross.get(seat) + 1}`);
            continue;
          }
          seenAcross.set(seat, index);
          unique.push(seat);
        }
        if (unique.length < 2) errors.push(`條件 ${index + 1} 至少需要 2 個座號`);
        groups.push(unique);
      });

      return { configured, groups, errors };
    }

    function updatePreviewAndButtons() {
      const isolation = parseIsolationGroups();
      const planResult = buildPlan({ includeIsolation: true, isolationGroups: isolation.groups });
      lastPlan = planResult.ok ? planResult.plan : null;

      const preview = document.getElementById('calc-preview');
      if (planResult.ok) {
        preview.className = 'mt-4 p-4 rounded-xl bg-ocean-50/90 dark:bg-ocean-950/35 border border-ocean-200 dark:border-ocean-800 font-black text-ocean-800 dark:text-ocean-200 text-base md:text-lg';
        preview.innerHTML = planResult.previewHtml;
      } else {
        preview.className = 'mt-4 p-4 rounded-xl bg-rose-50 dark:bg-rose-950/25 border border-rose-200 dark:border-rose-900 font-black text-rose-700 dark:text-rose-300 text-base md:text-lg';
        preview.textContent = planResult.error;
      }

      const isolationMessage = document.getElementById('isolation-message');
      if (isolation.errors.length > 0) {
        isolationMessage.className = 'mt-3 text-sm md:text-base font-bold text-rose-600 dark:text-rose-300';
        isolationMessage.textContent = isolation.errors[0];
      } else if (isolation.configured) {
        isolationMessage.className = 'mt-3 text-sm md:text-base font-bold text-ocean-700 dark:text-ocean-300';
        isolationMessage.textContent = '隔離條件已設定；逐組抽需先清除隔離條件。';
      } else {
        isolationMessage.textContent = '';
      }

      const instant = document.getElementById('btn-instant');
      const stepwise = document.getElementById('btn-stepwise');

      instant.disabled = !planOkay;

      const stepwisePlan = buildPlan({ includeIsolation: false, isolationGroups: [] });
      const stepwiseBlocked = isolation.configured || !stepwisePlan.ok;
      stepwise.disabled = stepwiseBlocked;
      note.classList.toggle('hidden', !sessionState.advancedOpen || !stepwiseBlocked);
      if (sessionState.advancedOpen && stepwiseBlocked) {
        note.textContent = isolation.configured ? '已設定隔離名單｜一組一組抽需先清除隔離條件。' : stepwisePlan.error;
      }
    }

    function getActiveParticipants() {
      const absent = new Set(sessionState.absentSeats.map(String));
      return roster.filter(item => !absent.has(item.seat));
    }

    function buildPlan({ includeIsolation, isolationGroups }) {
      const participants = getActiveParticipants();
      if (participants.length < 2) return { ok:false, error:'今日參與人數至少需要 2 人。' };

      if (sessionState.groupMode !== 'separate') {
        let groupCount;
        if (sessionState.scaleMode === 'by_groups') {
          groupCount = Math.trunc(sessionState.groups);
          if (groupCount < 1 || groupCount > participants.length) return { ok:false, error:`總組數需介於 1～${participants.length} 組。` };
        } else {
          const persons = Math.trunc(sessionState.persons);
          if (persons < 1) return { ok:false, error:'每組人數至少 1 人。' };
          groupCount = Math.ceil(participants.length / persons);
        }

        const sizes = balancedSizes(participants.length, groupCount);
        if (includeIsolation) {
          for (const group of isolationGroups) {
            const activeCount = group.filter(seat => participants.some(p => p.seat === seat)).length;
            if (activeCount > groupCount) return { ok:false, error:`隔離條件有 ${activeCount} 位今日參與者，但目前只有 ${groupCount} 組。` };
          }
        }
        return {
          ok:true,
          plan:{ kind:'mixed', sizes, groupMode:sessionState.groupMode },
          previewHtml:`預估：<span class="text-xl">${groupCount}</span> 組｜${sizes.join('、')}`
        };
      }

      const boys = participants.filter(p => p.gender === 'B');
      const girls = participants.filter(p => p.gender === 'G');
      let boysCount = 0;
      let girlsCount = 0;

      const minByIsolation = (gender) => {
        if (!includeIsolation) return 0;
        let min = 0;
        for (const group of isolationGroups) {
          const count = group.filter(seat => participants.some(p => p.seat === seat && p.gender === gender)).length;
          min = Math.max(min, count);
        }
        return min;
      };

      const minB = Math.max(boys.length > 0 ? 1 : 0, minByIsolation('B'));
      const minG = Math.max(girls.length > 0 ? 1 : 0, minByIsolation('G'));

      if (sessionState.separateScaleMode === 'groups') {
        if (sessionState.separateGroupsPlan === 'auto') {
          const totalGroups = Math.trunc(sessionState.separateTotalGroups);
          if (totalGroups < 1 || totalGroups > participants.length) return { ok:false, error:`總組數需介於 1～${participants.length} 組。` };
          const split = chooseSeparateGroupSplit(boys.length, girls.length, totalGroups, minB, minG);
          if (!split) return { ok:false, error:`目前條件至少需要男 ${minB} 組、女 ${minG} 組，總組數不足或無法分配。` };
          boysCount = split.boys;
          girlsCount = split.girls;
        } else {
          boysCount = Math.trunc(sessionState.boysGroups);
          girlsCount = Math.trunc(sessionState.girlsGroups);
          const manualError = validateManualGenderGroups(boys.length, girls.length, boysCount, girlsCount, minB, minG);
          if (manualError) return { ok:false, error:manualError };
        }
      } else {
        if (sessionState.separatePersonsPlan === 'common') {
          const target = Math.trunc(sessionState.separateCommonPersons);
          if (target < 1) return { ok:false, error:'每組人數至少 1 人。' };
          boysCount = boys.length > 0 ? Math.ceil(boys.length / target) : 0;
          girlsCount = girls.length > 0 ? Math.ceil(girls.length / target) : 0;
        } else {
          const bp = Math.trunc(sessionState.boysPersons);
          const gp = Math.trunc(sessionState.girlsPersons);
          if (boys.length > 0 && bp < 1) return { ok:false, error:'男生每組人數至少 1 人。' };
          if (girls.length > 0 && gp < 1) return { ok:false, error:'女生每組人數至少 1 人。' };
          boysCount = boys.length > 0 ? Math.ceil(boys.length / bp) : 0;
          girlsCount = girls.length > 0 ? Math.ceil(girls.length / gp) : 0;
        }
        if (boysCount < minB || girlsCount < minG) {
          return { ok:false, error:`目前隔離條件至少需要男 ${minB} 組、女 ${minG} 組；請調小每組人數。` };
        }
      }

      const boysSizes = boysCount > 0 ? balancedSizes(boys.length, boysCount) : [];
      const girlsSizes = girlsCount > 0 ? balancedSizes(girls.length, girlsCount) : [];
      const totalGroups = boysCount + girlsCount;
      const genderPreview = [];
      if (boysCount > 0) {
        genderPreview.push(`<div class="gender-preview-block gender-preview-boy"><span class="gender-preview-label">👦 男生 ${boysCount} 組</span><span class="gender-preview-sizes">${boysSizes.join('・')}</span></div>`);
      }
      if (girlsCount > 0) {
        genderPreview.push(`<div class="gender-preview-block gender-preview-girl"><span class="gender-preview-label">👧 女生 ${girlsCount} 組</span><span class="gender-preview-sizes">${girlsSizes.join('・')}</span></div>`);
      }
      return {
        ok:true,
        plan:{ kind:'separate', boysSizes, girlsSizes, groupMode:'separate' },
        previewHtml:`<div class="preview-total">預估共 <span>${totalGroups}</span> 組</div><div class="gender-preview-grid">${genderPreview.join('')}</div>`
      };
    }

    function validateManualGenderGroups(boys, girls, boysGroups, girlsGroups, minB, minG) {
      if (boysGroups < 0 || girlsGroups < 0) return '組數不可小於 0。';
      if (boys === 0 && boysGroups !== 0) return '今天沒有男生參與，男生組數請設為 0。';
      if (girls === 0 && girlsGroups !== 0) return '今天沒有女生參與，女生組數請設為 0。';
      if (boys > 0 && boysGroups < 1) return '有男生參與時，男生至少需要 1 組。';
      if (girls > 0 && girlsGroups < 1) return '有女生參與時，女生至少需要 1 組。';
      if (boysGroups > boys) return `男生只有 ${boys} 人，不能分成 ${boysGroups} 組。`;
      if (girlsGroups > girls) return `女生只有 ${girls} 人，不能分成 ${girlsGroups} 組。`;
      if (boysGroups < minB || girlsGroups < minG) return `目前隔離條件至少需要男 ${minB} 組、女 ${minG} 組。`;
      return '';
    }

    function chooseSeparateGroupSplit(boys, girls, total, minB, minG) {
      let best = null;
      for (let b = 0; b <= total; b++) {
        const g = total - b;
        if (b < minB || g < minG) continue;
        if (b > boys || g > girls) continue;
        if (boys > 0 && b === 0) continue;
        if (girls > 0 && g === 0) continue;
        const avgB = b > 0 ? boys / b : 0;
        const avgG = g > 0 ? girls / g : 0;
        const diff = boys > 0 && girls > 0 ? Math.abs(avgB - avgG) : 0;
        const largerSideBonus = boys >= girls ? -b * 1e-4 : -g * 1e-4;
        const score = diff + largerSideBonus;
        if (!best || score < best.score) best = { boys:b, girls:g, score };
      }
      return best;
    }

    function balancedSizes(total, groups) {
      const base = Math.floor(total / groups);
      const remainder = total % groups;
      return Array.from({ length: groups }, (_, index) => base + (index < remainder ? 1 : 0));
    }

    // ---------- 一次分完 ----------
    function startInstantGrouping() {
      readGroupControlsToState();
      saveSessionState();
      const isolation = parseIsolationGroups();
      if (isolation.errors.length > 0) {
        showToast(isolation.errors[0], 'error');
        return;
      }
      const planResult = buildPlan({ includeIsolation:true, isolationGroups:isolation.groups });
      if (!planResult.ok) {
        showToast(planResult.error, 'error');
        return;
      }
      const participants = getActiveParticipants();
      let groups;
      if (planResult.plan.kind === 'mixed') {
        groups = assignIntoGroups(participants, planResult.plan.sizes, isolation.groups, sessionState.groupMode);
        if (!groups) {
          showToast('目前條件無法完成分組，請調整隔離條件或組數。', 'error');
          return;
        }
        finalResults = groups.map((members, index) => ({ label:`第 ${index + 1} 組`, members }));
      } else {
        const boys = participants.filter(p => p.gender === 'B');
        const girls = participants.filter(p => p.gender === 'G');
        const boyIso = isolation.groups.map(group => group.filter(seat => boys.some(p => p.seat === seat))).filter(group => group.length >= 2);
        const girlIso = isolation.groups.map(group => group.filter(seat => girls.some(p => p.seat === seat))).filter(group => group.length >= 2);
        const boyGroups = planResult.plan.boysSizes.length ? assignIntoGroups(boys, planResult.plan.boysSizes, boyIso, 'random') : [];
        const girlGroups = planResult.plan.girlsSizes.length ? assignIntoGroups(girls, planResult.plan.girlsSizes, girlIso, 'random') : [];
        if ((planResult.plan.boysSizes.length && !boyGroups) || (planResult.plan.girlsSizes.length && !girlGroups)) {
          showToast('目前條件無法完成男女分開分組，請調整設定。', 'error');
          return;
        }
        finalResults = [
          ...(boyGroups || []).map((members, index) => ({ label:`男生第 ${index + 1} 組`, members })),
          ...(girlGroups || []).map((members, index) => ({ label:`女生第 ${index + 1} 組`, members }))
        ];
      }
      triggerConfetti();
      showView('result');
    }

    function assignIntoGroups(participants, sizes, isolationGroups, mode) {
      if (participants.length !== sizes.reduce((a,b) => a + b, 0)) return null;
      const bySeat = new Map(participants.map(p => [p.seat, p]));
      const constrained = isolationGroups
        .map(group => group.map(seat => bySeat.get(seat)).filter(Boolean))
        .filter(group => group.length >= 2)
        .sort((a,b) => b.length - a.length);

      for (let attempt = 0; attempt < 700; attempt++) {
        const groups = sizes.map(() => []);
        const caps = sizes.slice();
        const assigned = new Set();
        let failed = false;

        for (const condition of constrained) {
          const members = shuffleArray(condition.slice());
          const usedGroupIndexes = new Set();
          for (const member of members) {
            const candidates = caps.map((cap, index) => ({ index, cap }))
              .filter(item => item.cap > 0 && !usedGroupIndexes.has(item.index));
            if (candidates.length === 0) { failed = true; break; }
            const chosen = chooseBestGroupForMember(candidates, groups, member, mode);
            groups[chosen].push(member);
            caps[chosen]--;
            usedGroupIndexes.add(chosen);
            assigned.add(member.seat);
          }
          if (failed) break;
        }
        if (failed) continue;

        const remaining = shuffleArray(participants.filter(p => !assigned.has(p.seat)));
        for (const member of remaining) {
          const candidates = caps.map((cap, index) => ({ index, cap })).filter(item => item.cap > 0);
          if (candidates.length === 0) { failed = true; break; }
          const chosen = chooseBestGroupForMember(candidates, groups, member, mode);
          groups[chosen].push(member);
          caps[chosen]--;
        }
        if (failed || caps.some(cap => cap !== 0)) continue;
        if (verifyIsolation(groups, constrained)) return groups;
      }
      return null;
    }

    function chooseBestGroupForMember(candidates, groups, member, mode) {
      const scored = candidates.map(item => {
        const group = groups[item.index];
        let score = item.cap * 8 + cryptoRandom();
        if (mode === 'balanced') {
          const b = group.filter(m => m.gender === 'B').length + (member.gender === 'B' ? 1 : 0);
          const g = group.filter(m => m.gender === 'G').length + (member.gender === 'G' ? 1 : 0);
          score -= Math.abs(b - g) * 18;
        }
        return { index:item.index, score };
      });
      scored.sort((a,b) => b.score - a.score);
      return scored[0].index;
    }

    function verifyIsolation(groups, conditions) {
      for (const condition of conditions) {
        const set = new Set(condition.map(m => m.seat));
        for (const group of groups) {
          if (group.filter(m => set.has(m.seat)).length > 1) return false;
        }
      }
      return true;
    }

    // ---------- 一組一組抽 ----------
    function startStepwiseGrouping() {
      const isolation = parseIsolationGroups();
      if (isolation.configured) {
        showToast('一組一組抽需先清除隔離條件。', 'error');
        return;
      }
      readGroupControlsToState();
      saveSessionState();
      const planResult = buildPlan({ includeIsolation:false, isolationGroups:[] });
      if (!planResult.ok) {
        showToast(planResult.error, 'error');
        return;
      }
      const participants = getActiveParticipants().map(p => ({ ...p }));
      if (planResult.plan.kind === 'mixed') {
        arenaState = {
          kind:'mixed',
          remaining:participants,
          sizes:planResult.plan.sizes.slice(),
          nextIndex:0,
          completed:[],
          tempExcluded:new Set(),
          selectedGender:null
        };
      } else {
        arenaState = {
          kind:'separate',
          remaining:participants,
          boysSizes:planResult.plan.boysSizes.slice(),
          girlsSizes:planResult.plan.girlsSizes.slice(),
          boysIndex:0,
          girlsIndex:0,
          completed:[],
          tempExcluded:new Set(),
          selectedGender:null
        };
      }
      showView('arena');
    }

    function renderArena() {
      if (!arenaState) {
        showView('group');
        return;
      }
      const completedCount = arenaState.completed.length;
      document.getElementById('arena-summary').textContent = `已完成 ${completedCount} 組｜剩餘 ${arenaState.remaining.length} 人`;
      renderArenaCompleted();

      if (arenaState.kind === 'separate') {
        renderArenaGenderChoice();
      } else {
        document.getElementById('arena-gender-choice').classList.add('hidden');
      }
      renderArenaCurrentGroup();
    }

    function renderArenaGenderChoice() {
      const box = document.getElementById('arena-gender-choice');
      box.classList.remove('hidden');
      box.innerHTML = '';
      const title = document.createElement('h3');
      title.className = 'text-2xl font-black mb-4';
      title.textContent = '下一組要抽哪一邊？';
      box.appendChild(title);

      const wrap = document.createElement('div');
      wrap.className = 'grid grid-cols-1 sm:grid-cols-2 gap-4';
      const boysLeft = arenaState.boysIndex < arenaState.boysSizes.length;
      const girlsLeft = arenaState.girlsIndex < arenaState.girlsSizes.length;

      if (boysLeft) {
        wrap.appendChild(makeGenderChoiceButton('B', `👦 男生第 ${arenaState.boysIndex + 1} 組｜${arenaState.boysSizes[arenaState.boysIndex]} 人`));
      }
      if (girlsLeft) {
        wrap.appendChild(makeGenderChoiceButton('G', `👧 女生第 ${arenaState.girlsIndex + 1} 組｜${arenaState.girlsSizes[arenaState.girlsIndex]} 人`));
      }
      box.appendChild(wrap);
    }

    function makeGenderChoiceButton(gender, text) {
      const button = document.createElement('button');
      button.type = 'button';
      const selected = arenaState.selectedGender === gender;
      button.className = `min-h-[58px] rounded-2xl font-black text-lg border-2 ${selected ? 'bg-ocean-500 text-white border-ocean-500' : 'bg-white dark:bg-slate-800 border-ocean-200 dark:border-ocean-800 text-ocean-800 dark:text-ocean-200 hover:border-ocean-400'}`;
      button.textContent = text;
      button.addEventListener('click', () => {
        arenaState.selectedGender = gender;
        arenaState.tempExcluded.clear();
        renderArena();
      });
      return button;
    }

    function renderArenaCurrentGroup() {
      const current = getArenaCurrentSpec();
      const card = document.getElementById('arena-current-card');
      if (!current) {
        card.classList.toggle('hidden', arenaState.kind === 'separate' && !arenaState.selectedGender);
        document.getElementById('arena-current-title').textContent = '請先選擇男生組或女生組';
        document.getElementById('arena-current-note').textContent = '';
        document.getElementById('arena-remain-badge').textContent = `剩餘 ${arenaState.remaining.length} 人`;
        document.getElementById('arena-pool').innerHTML = '';
        document.getElementById('arena-excluded-summary').textContent = '';
        document.getElementById('arena-draw-warning').textContent = '';
        document.getElementById('btn-draw-current').disabled = true;
        return;
      }
      card.classList.remove('hidden');
      document.getElementById('arena-current-title').textContent = `${current.label}｜本組 ${current.size} 人`;
      document.getElementById('arena-remain-badge').textContent = `剩餘 ${arenaState.remaining.length} 人`;

      const candidates = current.gender
        ? arenaState.remaining.filter(p => p.gender === current.gender)
        : arenaState.remaining.slice();
      const isLastForPool = candidates.length === current.size;
      document.getElementById('arena-current-note').textContent = isLastForPool
        ? '最後一組將收完這一側的剩餘學生。'
        : '抽出前可先暫時排除本組不希望抽到的座號。';
      document.getElementById('arena-exclusion-block').classList.toggle('soft-disabled', isLastForPool);

      const pool = document.getElementById('arena-pool');
      pool.innerHTML = '';
      candidates.sort(compareSeats).forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        const excluded = arenaState.tempExcluded.has(item.seat);
        button.className = `seat-chip rounded-xl font-black text-lg border ${item.gender === 'B' ? 'chip-boy' : 'chip-girl'} ${excluded ? 'chip-excluded' : ''}`;
        button.textContent = item.seat;
        button.disabled = isLastForPool;
        button.addEventListener('click', () => toggleTempExcluded(item.seat));
        pool.appendChild(button);
      });

      if (isLastForPool) arenaState.tempExcluded.clear();
      const excluded = [...arenaState.tempExcluded].sort((a,b) => Number(a)-Number(b));
      document.getElementById('arena-excluded-summary').textContent = excluded.length ? `已暫時排除：${excluded.join('、')}` : '';

      const activeCount = candidates.filter(p => !arenaState.tempExcluded.has(p.seat)).length;
      const canDraw = activeCount >= current.size;
      document.getElementById('btn-draw-current').disabled = !canDraw;
      document.getElementById('btn-draw-current').textContent = `抽出 ${current.label}`;
      document.getElementById('arena-draw-warning').textContent = canDraw ? '' : `暫時排除過多，本組需要 ${current.size} 人。`;
    }

    function getArenaCurrentSpec() {
      if (!arenaState) return null;
      if (arenaState.kind === 'mixed') {
        if (arenaState.nextIndex >= arenaState.sizes.length) return null;
        return { label:`第 ${arenaState.nextIndex + 1} 組`, size:arenaState.sizes[arenaState.nextIndex], gender:null };
      }
      if (!arenaState.selectedGender) return null;
      if (arenaState.selectedGender === 'B') {
        if (arenaState.boysIndex >= arenaState.boysSizes.length) return null;
        return { label:`男生第 ${arenaState.boysIndex + 1} 組`, size:arenaState.boysSizes[arenaState.boysIndex], gender:'B' };
      }
      if (arenaState.girlsIndex >= arenaState.girlsSizes.length) return null;
      return { label:`女生第 ${arenaState.girlsIndex + 1} 組`, size:arenaState.girlsSizes[arenaState.girlsIndex], gender:'G' };
    }

    function toggleTempExcluded(seat) {
      if (arenaState.tempExcluded.has(seat)) arenaState.tempExcluded.delete(seat);
      else arenaState.tempExcluded.add(seat);
      renderArenaCurrentGroup();
    }

    function clearTempExclusions() {
      if (!arenaState) return;
      arenaState.tempExcluded.clear();
      renderArenaCurrentGroup();
    }

    function drawCurrentArenaGroup() {
      const spec = getArenaCurrentSpec();
      if (!spec) return;
      let candidates = arenaState.remaining.filter(p => !spec.gender || p.gender === spec.gender);
      const active = candidates.filter(p => !arenaState.tempExcluded.has(p.seat));
      if (active.length < spec.size) {
        showToast(`本組需要 ${spec.size} 人，請減少暫時排除。`, 'error');
        return;
      }
      let members;
      if (arenaState.kind === 'mixed' && sessionState.groupMode === 'balanced') {
        members = drawBalancedGroup(active, spec.size);
      } else {
        members = shuffleArray(active.slice()).slice(0, spec.size);
      }
      const selectedSeats = new Set(members.map(m => m.seat));
      arenaState.remaining = arenaState.remaining.filter(p => !selectedSeats.has(p.seat));
      arenaState.completed.push({ label:spec.label, members });
      arenaState.tempExcluded.clear();

      if (arenaState.kind === 'mixed') {
        arenaState.nextIndex++;
      } else if (spec.gender === 'B') {
        arenaState.boysIndex++;
        arenaState.selectedGender = null;
      } else {
        arenaState.girlsIndex++;
        arenaState.selectedGender = null;
      }

      if (arenaState.remaining.length === 0) {
        finalResults = arenaState.completed.map(group => ({ label:group.label, members:group.members }));
        triggerConfetti();
        showView('result');
        return;
      }
      renderArena();
    }

    function drawBalancedGroup(pool, size) {
      const boys = shuffleArray(pool.filter(p => p.gender === 'B'));
      const girls = shuffleArray(pool.filter(p => p.gender === 'G'));
      let targetB = Math.floor(size / 2);
      let targetG = size - targetB;
      if (boys.length > girls.length && size % 2 === 1) {
        targetB = Math.ceil(size / 2);
        targetG = size - targetB;
      }
      targetB = Math.min(targetB, boys.length);
      targetG = Math.min(targetG, girls.length);
      let chosen = [...boys.slice(0, targetB), ...girls.slice(0, targetG)];
      if (chosen.length < size) {
        const used = new Set(chosen.map(p => p.seat));
        const fallback = shuffleArray(pool.filter(p => !used.has(p.seat)));
        chosen = chosen.concat(fallback.slice(0, size - chosen.length));
      }
      return shuffleArray(chosen);
    }

    function renderArenaCompleted() {
      const container = document.getElementById('arena-completed');
      container.innerHTML = '';
      if (arenaState.completed.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'text-slate-400 font-bold';
        empty.textContent = '尚未抽出任何組別。';
        container.appendChild(empty);
        return;
      }
      arenaState.completed.forEach(group => container.appendChild(createGroupCard(group.label, group.members, true)));
    }

    function backFromArena() {
      if (arenaState?.completed?.length > 0) {
        if (!confirm('返回快速分組會取消目前已抽出的組別，確定返回嗎？')) return;
      }
      arenaState = null;
      showView('group');
    }

    // ---------- 結果 ----------
    function renderResultPage() {
      document.getElementById('result-summary').textContent = `共 ${finalResults.length} 組｜${finalResults.reduce((sum,g) => sum + g.members.length, 0)} 人`;
      const container = document.getElementById('result-groups');
      container.innerHTML = '';
      finalResults.forEach(group => container.appendChild(createGroupCard(group.label, group.members, false)));
    }

    function createGroupCard(label, members, compact) {
      const card = document.createElement('div');
      card.className = `group-card acrylic-card rounded-3xl p-5 border-t-4 border-t-ocean-400 animate-pop-in ${compact ? 'min-h-0' : ''}`;
      const boys = members.filter(m => m.gender === 'B').length;
      const girls = members.filter(m => m.gender === 'G').length;
      const head = document.createElement('div');
      head.className = 'flex justify-between items-center gap-3 border-b border-slate-200 dark:border-slate-700/60 pb-3 mb-4';
      const title = document.createElement('h3');
      title.className = 'text-2xl font-black text-ocean-700 dark:text-ocean-300';
      title.textContent = label;
      const badge = document.createElement('span');
      badge.className = 'text-sm font-black px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
      badge.textContent = `${members.length}人｜${boys}男${girls}女`;
      head.append(title, badge);
      card.appendChild(head);

      const body = document.createElement('div');
      body.className = 'flex flex-wrap gap-2.5';
      members.slice().sort(compareSeats).forEach(member => {
        const chip = document.createElement('span');
        chip.className = `w-12 h-12 rounded-2xl flex items-center justify-center font-black text-lg border ${member.gender === 'B' ? 'chip-boy' : 'chip-girl'}`;
        chip.textContent = member.seat;
        body.appendChild(chip);
      });
      card.appendChild(body);
      return card;
    }

    function backToGroupFromResult() {
      finalResults = [];
      arenaState = null;
      showView('group');
    }

    function exportGroups() {
      if (!finalResults.length) {
        showToast('目前沒有結果可匯出。', 'error');
        return;
      }
      if (typeof XLSXWriter === 'undefined') {
        showToast('Excel 元件尚未載入。', 'error');
        return;
      }
      const rows = [];
      finalResults.forEach(group => {
        group.members.slice().sort(compareSeats).forEach(member => {
          rows.push({ '組別':group.label, '座號':member.seat, '性別':member.gender === 'B' ? '男' : '女' });
        });
      });
      const ws = XLSXWriter.utils.json_to_sheet(rows);
      const wb = XLSXWriter.utils.book_new();
      XLSXWriter.utils.book_append_sheet(wb, ws, '分組結果');
      XLSXWriter.writeFile(wb, '動態分組結果.xlsx');
    }

    // ---------- 工具 ----------
    function cryptoRandom() {
      const array = new Uint32Array(1);
      crypto.getRandomValues(array);
      return array[0] / 4294967296;
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(cryptoRandom() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `${type === 'error' ? 'bg-rose-500' : 'bg-ocean-500'} text-white px-5 py-3 rounded-2xl shadow-2xl font-black text-base md:text-lg text-center border border-white/20 animate-fade-in`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        toast.style.transition = 'all .25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2600);
    }

    function triggerConfetti() {
      if (typeof confetti !== 'function') return;
      confetti({ particleCount:90, spread:80, origin:{ y:.7 }, zIndex:9999 });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    }

    function setValue(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value;
    }

    function setRadio(name, value) {
      const el = document.querySelector(`input[name="${name}"][value="${value}"]`);
      if (el) el.checked = true;
    }

    function valueOf(id, fallback) {
      return document.getElementById(id)?.value ?? fallback;
    }

    function numberOf(id, fallback) {
      const value = Number(document.getElementById(id)?.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function checkedValue(name, fallback) {
      return document.querySelector(`input[name="${name}"]:checked`)?.value ?? fallback;
    }
  </script>
</body>
